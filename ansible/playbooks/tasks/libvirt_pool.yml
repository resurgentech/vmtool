---
# Define, build, start and autostart one dir-type libvirt storage pool.
# Called from setup_host.yml with loop_var `pool` ({name: ..., path: ...}).
# Mirrors Manager.CreatePool in pkg/vmtool/libvirt.go.
#
# A pool with `owner` (the hypervisor's vmtool pool: owner, uid, gid, mode) is
# ours: its directory is kept at that owner and mode, and it is defined from XML
# whose <permissions> name the uid/gid and mode. If a pool of that name already
# exists with another target path, the play fails and changes nothing.

- name: "Inspect the {{ pool.name }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-info {{ pool.name }}"
  register: vmtool_pool_info
  changed_when: false
  check_mode: false
  failed_when: false

- name: "Read the {{ pool.name }} pool's target path"
  ansible.builtin.command: "virsh -c qemu:///system pool-dumpxml {{ pool.name }}"
  register: vmtool_pool_xml
  changed_when: false
  check_mode: false
  when:
    - pool.owner is defined
    - vmtool_pool_info.rc == 0

- name: "Refuse a {{ pool.name }} pool that points somewhere else"
  ansible.builtin.fail:
    msg: >-
      libvirt pool {{ pool.name }} already exists with target
      {{ _have }}, but vmtool wants {{ pool.path }}. Nothing was changed;
      remove or repoint that pool yourself.
  vars:
    _have: "{{ vmtool_pool_xml.stdout | regex_search('<target>\\s*<path>([^<]*)</path>', '\\1') | first | default('') | trim }}"
  when:
    - pool.owner is defined
    - vmtool_pool_info.rc == 0
    - _have != pool.path

- name: "Check {{ pool.path }}"
  ansible.builtin.stat:
    path: "{{ pool.path }}"
  register: vmtool_pool_dir

# Created only when absent: an existing directory keeps whatever ownership and
# mode the distro or the admin gave it.
- name: "Create {{ pool.path }}"
  ansible.builtin.file:
    path: "{{ pool.path }}"
    state: directory
    owner: root
    group: root
    mode: "0711"
  when:
    - pool.owner is not defined
    - not vmtool_pool_dir.stat.exists

# Ours: always keep the owner and mode.
- name: "Create {{ pool.path }} for {{ pool.owner | default('') }}"
  ansible.builtin.file:
    path: "{{ pool.path }}"
    state: directory
    owner: "{{ pool.owner }}"
    group: "{{ pool.owner }}"
    mode: "{{ pool.mode }}"
  when: pool.owner is defined

- name: "Define the {{ pool.name }} pool"
  ansible.builtin.command: >-
    virsh -c qemu:///system pool-define-as {{ pool.name }} dir
    --target {{ pool.path }}
  when:
    - pool.owner is not defined
    - vmtool_pool_info.rc != 0

- name: "Define the {{ pool.name }} pool with its ownership"
  ansible.builtin.command:
    argv: [virsh, -c, "qemu:///system", pool-define, /dev/stdin]
    stdin: |
      <pool type='dir'>
        <name>{{ pool.name }}</name>
        <target>
          <path>{{ pool.path }}</path>
          <permissions>
            <mode>{{ pool.mode }}</mode>
            <owner>{{ pool.uid }}</owner>
            <group>{{ pool.gid }}</group>
          </permissions>
        </target>
      </pool>
  when:
    - pool.owner is defined
    - vmtool_pool_info.rc != 0

- name: "Build the {{ pool.name }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-build {{ pool.name }}"
  when: vmtool_pool_info.rc != 0

- name: "Autostart the {{ pool.name }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-autostart {{ pool.name }}"
  when: vmtool_pool_info.rc != 0 or vmtool_pool_info.stdout is search('Autostart:\s+no')

- name: "Start the {{ pool.name }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-start {{ pool.name }}"
  when: vmtool_pool_info.rc != 0 or vmtool_pool_info.stdout is search('State:\s+inactive')

# vmtool lists images straight out of the pool, so pick up anything dropped
# into the directory outside libvirt (packer output, manual copies).
- name: "Refresh the {{ pool.name }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-refresh {{ pool.name }}"
  changed_when: false
