---
# Build an NVMe stripe (md RAID 0), an LVM volume group on it, and a libvirt
# `logical` storage pool over that volume group, for vmtool's fast block disks.
# Called from setup_host.yml only when vmtool_nvme_drives is non-empty.
#
# DESTRUCTIVE BY NATURE: this is destructive by nature, runs only with the
# drives named, and refuses non-blank drives. Nothing here runs unless
# `vmtool_nvme_drives` lists /dev/disk/by-id/ paths; every drive must be whole,
# unpartitioned, carry no signature, have no holders and be neither mounted nor
# swap, or the play fails and changes nothing. If the volume group already
# exists it is adopted: the drives are then not examined and not written.
#
#   just prereqs veritech02 -e '{"vmtool_nvme_drives":["/dev/disk/by-id/nvme-A","/dev/disk/by-id/nvme-B"]}'
#
# The commands here that write storage are the md array create, pvcreate and
# vgcreate (guarded by vmtool_nvme_create), the thin pool's lvcreate, and, only
# when the thin pool does not exist yet, one scratch volume
# (vmtool-discard-scratch, tagged vmtool_scratch) over the free space, which is
# discarded and removed so old data on the drives is not handed to a new VM.
# That scratch volume is the only volume this file removes; no volume group,
# physical volume or array is ever removed, stopped or wiped by it. The play
# also sets issue_discards = 1 in lvm.conf. The probes are read-only. The pool
# is defined without pool-build, because on a logical pool that would run
# pvcreate/vgcreate itself.
#
# Variables (defaults in setup_host.yml): vmtool_nvme_drives, vmtool_nvme_vg,
# vmtool_nvme_md (array name, /dev/md/<name>), vmtool_nvme_pool.
#
# Opt-in thin pool (vmtool_nvme_thin, default false): to add an LVM thin pool
# to an existing array, name the array's drives again and set the switch; the
# existing volume group is adopted and the drives are not written. By default
# the pool takes 70 % of the volume group's free space:
#
#   just prereqs <host> -e '{"vmtool_nvme_drives":["/dev/disk/by-id/nvme-PLACEHOLDER_1","/dev/disk/by-id/nvme-PLACEHOLDER_2"],"vmtool_nvme_thin":true}'
#
# Also: vmtool_nvme_thin_pool (nvme-thin), vmtool_nvme_thin_size (70%FREE, any
# lvcreate -l or -L value such as 2T), vmtool_nvme_thin_chunk (512k) and
# vmtool_nvme_thin_metadata (8G). The pool is created tagged vmtool_thinpool
# with zeroing off and the vmtool-thin profile (autoextend at 80 %, by 10 %); a
# pool of that name that exists tagged is adopted (zeroing and profile are
# corrected), one that is not a tagged thin pool makes the play fail.

# ---------------------------------------------------------------- preflight

- name: Fail on a family that is not Debian
  ansible.builtin.fail:
    msg: "The NVMe stripe is only built on Debian/Ubuntu hosts; this host is {{ vmtool_family }}. Nothing was changed."
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_family != 'debian'

- name: Fail on fewer than 2 drives
  ansible.builtin.fail:
    msg: "vmtool_nvme_drives needs at least 2 drives for a stripe, got {{ vmtool_nvme_drives | length }}. Nothing was changed."
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_drives | length < 2

- name: "Fail on a drive that is not a whole /dev/disk/by-id/ path"
  ansible.builtin.fail:
    msg: >-
      {{ item }}: each drive must be a /dev/disk/by-id/ path without -part and
      without '..'. Nothing was changed.
  loop: "{{ vmtool_nvme_drives }}"
  when:
    - vmtool_nvme_drives | length > 0
    - (not (item is match('^/dev/disk/by-id/'))) or ('-part' in item) or ('..' in item)

- name: Resolve the drives
  ansible.builtin.command:
    argv: [realpath, -m, "{{ item }}"]
  register: vmtool_nvme_realpaths
  changed_when: false
  check_mode: false
  loop: "{{ vmtool_nvme_drives }}"
  when: vmtool_nvme_drives | length > 0

- name: Remember the resolved drives
  ansible.builtin.set_fact:
    vmtool_nvme_real: "{{ vmtool_nvme_realpaths.results | map(attribute='stdout') | map('trim') | list }}"
  when: vmtool_nvme_drives | length > 0

- name: Fail on duplicate drives
  ansible.builtin.fail:
    msg: >-
      vmtool_nvme_drives names the same device twice once resolved
      ({{ vmtool_nvme_real | join(', ') }}); the list must be unique. Nothing was changed.
  when:
    - vmtool_nvme_drives | length > 0
    - (vmtool_nvme_real | unique | length) != (vmtool_nvme_real | length)

- name: Install mdadm and lvm2
  ansible.builtin.apt:
    name: [mdadm, lvm2]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: vmtool_nvme_drives | length > 0

# -------------------------------------------------------------------- adopt

- name: Look for the volume group
  ansible.builtin.command:
    argv: [vgs, --noheadings, -o, vg_name, "{{ vmtool_nvme_vg }}"]
  register: vmtool_nvme_vg_info
  changed_when: false
  check_mode: false
  failed_when: false
  when: vmtool_nvme_drives | length > 0

- name: Look for the md array
  ansible.builtin.stat:
    path: "/dev/md/{{ vmtool_nvme_md }}"
  register: vmtool_nvme_md_before
  when: vmtool_nvme_drives | length > 0

- name: Refuse an md array that exists without the volume group
  ansible.builtin.fail:
    msg: >-
      /dev/md/{{ vmtool_nvme_md }}: an md array of that name exists without the
      VG {{ vmtool_nvme_vg }}; nothing was changed. Finish or remove it yourself.
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_vg_info.rc != 0
    - vmtool_nvme_md_before.stat.exists

# With the VG present nothing below that examines or writes a drive runs.
- name: Decide whether to create the stripe
  ansible.builtin.set_fact:
    vmtool_nvme_create: "{{ vmtool_nvme_vg_info.rc != 0 and not vmtool_nvme_md_before.stat.exists }}"
  when: vmtool_nvme_drives | length > 0

- name: Say that the volume group is adopted
  ansible.builtin.debug:
    msg: "Volume group {{ vmtool_nvme_vg }} exists: adopting it; the drives are not examined or written."
  when:
    - vmtool_nvme_drives | length > 0
    - not (vmtool_nvme_create | bool)

# -------------------------------------------------------------- blank check

# Read-only. Every probe is skipped when the volume group is adopted.
- name: Check that each drive is a block device
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
  register: vmtool_nvme_stat
  loop: "{{ vmtool_nvme_drives }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a drive that is not a block device
  ansible.builtin.fail:
    msg: "{{ item.item }}: not a block device; nothing was changed."
  loop: "{{ vmtool_nvme_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - not (item.stat.isblk | default(false))

- name: List what is on each drive
  ansible.builtin.command:
    argv: [lsblk, --noheadings, --list, --output, NAME, "{{ item }}"]
  register: vmtool_nvme_lsblk
  changed_when: false
  check_mode: false
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a drive with partitions
  ansible.builtin.fail:
    msg: "{{ item.item }}: has a partition or child device ({{ item.stdout_lines[1:] | join(' ') }}); nothing was changed."
  loop: "{{ vmtool_nvme_lsblk.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item.stdout_lines | length > 1

- name: Look for signatures with a dry run
  ansible.builtin.command:
    argv: [wipefs, --no-act, "{{ item }}"]
  register: vmtool_nvme_sig
  changed_when: false
  check_mode: false
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Probe each drive for a signature
  ansible.builtin.command:
    argv: [blkid, -p, "{{ item }}"]
  register: vmtool_nvme_blkid
  changed_when: false
  check_mode: false
  failed_when: vmtool_nvme_blkid.rc not in [0, 2]
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a drive that carries a signature
  ansible.builtin.fail:
    msg: "{{ item.item }}: carries a signature (a filesystem, RAID or LVM label); nothing was changed."
  loop: "{{ vmtool_nvme_sig.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item.stdout | trim | length > 0

- name: Refuse a drive that blkid recognises
  ansible.builtin.fail:
    msg: "{{ item.item }}: blkid -p reports a signature; nothing was changed."
  loop: "{{ vmtool_nvme_blkid.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item.rc == 0

- name: Read the holders of each drive
  ansible.builtin.command:
    argv: [ls, -A, "/sys/class/block/{{ item | basename }}/holders"]
  register: vmtool_nvme_holders
  changed_when: false
  check_mode: false
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a drive that another device holds
  ansible.builtin.fail:
    msg: "{{ item.item }}: is held by another device ({{ item.stdout_lines | join(' ') }}); nothing was changed."
  loop: "{{ vmtool_nvme_holders.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item.stdout | trim | length > 0

- name: Look for mounts on each drive
  ansible.builtin.command:
    argv: [findmnt, --noheadings, --source, "{{ item }}"]
  register: vmtool_nvme_mounts
  changed_when: false
  check_mode: false
  failed_when: vmtool_nvme_mounts.rc not in [0, 1]
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a mounted drive
  ansible.builtin.fail:
    msg: "{{ item.item }}: is mounted; nothing was changed."
  loop: "{{ vmtool_nvme_mounts.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item.rc == 0

- name: List swap
  ansible.builtin.command:
    argv: [swapon, --noheadings, "--show=NAME"]
  register: vmtool_nvme_swap
  changed_when: false
  check_mode: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Refuse a drive used as swap
  ansible.builtin.fail:
    msg: "{{ item }}: is used as swap; nothing was changed."
  loop: "{{ vmtool_nvme_real }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool
    - item in (vmtool_nvme_swap.stdout_lines | map('trim') | list)

# ------------------------------------------------------------------- create

# The only writing storage commands in this file.
- name: Create the md RAID 0 array
  ansible.builtin.command:
    argv: >-
      {{ ['mdadm', '--create', '/dev/md/' ~ vmtool_nvme_md, '--level=0',
          '--raid-devices=' ~ (vmtool_nvme_drives | length), '--metadata=1.2',
          '--name=' ~ vmtool_nvme_md] + vmtool_nvme_drives }}
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Wait for the array device
  ansible.builtin.command: udevadm settle
  changed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Create the physical volume
  ansible.builtin.command:
    argv: [pvcreate, "/dev/md/{{ vmtool_nvme_md }}"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

- name: Create the volume group
  ansible.builtin.command:
    argv: [vgcreate, "{{ vmtool_nvme_vg }}", "/dev/md/{{ vmtool_nvme_md }}"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_create | bool

# ----------------------------------------------------------- thick discards

# issue_discards = 1 makes LVM discard the extents of any volume it removes or
# shrinks, so a thick volume's old data does not reach the next volume that
# takes its extents (libvirt's vol-delete runs lvremove, so it is covered too).
# The key exists only in the devices section; a commented, 0 or 1 line is
# replaced by the one line, so a file that is right is left as it is, and a
# missing line goes after `devices {`. No back-references.
- name: "Set issue_discards = 1 in /etc/lvm/lvm.conf"
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^\s*#?\s*issue_discards\s*='
    insertafter: '^devices\s*\{'
    line: "\tissue_discards = 1"
  when: vmtool_nvme_drives | length > 0

# Read-only. Under --check the file was not written, so the verdict is skipped.
- name: Read issue_discards back from LVM
  ansible.builtin.command:
    argv: [lvmconfig, devices/issue_discards]
  register: vmtool_nvme_issue_discards
  changed_when: false
  check_mode: false
  failed_when: false
  when: vmtool_nvme_drives | length > 0

- name: Fail unless LVM reports issue_discards=1
  ansible.builtin.fail:
    msg: >-
      lvmconfig devices/issue_discards says '{{ vmtool_nvme_issue_discards.stdout | default('') | trim }}'
      (rc {{ vmtool_nvme_issue_discards.rc | default('?') }}), not issue_discards=1, so removed thick volumes
      would not be discarded. Nothing was changed in the volume group; look at the devices section of
      /etc/lvm/lvm.conf (an active line elsewhere, or no devices section) and run the play again.
  when:
    - vmtool_nvme_drives | length > 0
    - not ansible_check_mode
    - (vmtool_nvme_issue_discards.stdout | default('') | trim) != 'issue_discards=1'

# -------------------------------------------------------------- persistence

- name: Look for the md array again
  ansible.builtin.stat:
    path: "/dev/md/{{ vmtool_nvme_md }}"
  register: vmtool_nvme_md_now
  when: vmtool_nvme_drives | length > 0

- name: Read the array's ARRAY line
  ansible.builtin.command:
    argv: [mdadm, --detail, --brief, "/dev/md/{{ vmtool_nvme_md }}"]
  register: vmtool_nvme_detail
  changed_when: false
  check_mode: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_md_now.stat.exists

# Keyed on the array's UUID, so a line for another array is left alone.
- name: Record the array in /etc/mdadm/mdadm.conf
  ansible.builtin.lineinfile:
    path: /etc/mdadm/mdadm.conf
    create: true
    mode: "0644"
    regexp: '^ARRAY\s.*UUID={{ _uuid }}'
    line: "{{ vmtool_nvme_detail.stdout_lines | select('match', '^ARRAY') | first }}"
  vars:
    # No back-reference: how one must be escaped differs between Ansible
    # versions, so the match is cut down with regex_replace instead. Block
    # scalar, so YAML hands Jinja the text as written.
    _uuid: >-
      {{ vmtool_nvme_detail.stdout | regex_search('UUID=[0-9a-f:]+') | default('', true) | regex_replace('^UUID=', '') }}
  register: vmtool_nvme_conf
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_md_now.stat.exists

- name: Rebuild the initramfs so the array assembles at boot
  ansible.builtin.command: update-initramfs -u
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_conf is changed

# --------------------------------------------------------------------- pool

- name: "Inspect the {{ vmtool_nvme_pool }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-info {{ vmtool_nvme_pool }}"
  register: vmtool_nvme_pool_info
  changed_when: false
  check_mode: false
  failed_when: false
  when: vmtool_nvme_drives | length > 0

- name: "Read the {{ vmtool_nvme_pool }} pool's type and source"
  ansible.builtin.command: "virsh -c qemu:///system pool-dumpxml {{ vmtool_nvme_pool }}"
  register: vmtool_nvme_pool_xml
  changed_when: false
  check_mode: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_pool_info.rc == 0

# An existing pool of the same type and source volume group is adopted as it is.
- name: "Refuse a {{ vmtool_nvme_pool }} pool that is something else"
  ansible.builtin.fail:
    msg: >-
      libvirt pool {{ vmtool_nvme_pool }} already exists with type
      '{{ _type }}' and source volume group '{{ _src }}', but vmtool wants type
      'logical' over {{ vmtool_nvme_vg }}. Nothing was changed; remove or repoint
      that pool yourself.
  vars:
    # No back-references: how one must be escaped differs between Ansible
    # versions, so each match is cut down with regex_replace instead. Block
    # scalars, so YAML hands Jinja the text as written.
    _type: >-
      {{ vmtool_nvme_pool_xml.stdout | regex_search("<pool\s+type='[^']*'") | default('', true) | regex_replace("^<pool\s+type='", '') | regex_replace("'$", '') }}
    _src: >-
      {{ vmtool_nvme_pool_xml.stdout | regex_search('<source>[\s\S]*?<name>[^<]*</name>') | default('', true) | regex_replace('^[\s\S]*<name>', '') | regex_replace('</name>$', '') | trim }}
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_pool_info.rc == 0
    - _type != 'logical' or _src != vmtool_nvme_vg

# No pool-build: on a logical pool it would run pvcreate/vgcreate.
- name: "Define the {{ vmtool_nvme_pool }} pool"
  ansible.builtin.command:
    argv: [virsh, -c, "qemu:///system", pool-define, /dev/stdin]
    stdin: |
      <pool type='logical'>
        <name>{{ vmtool_nvme_pool }}</name>
        <source>
          <name>{{ vmtool_nvme_vg }}</name>
          <format type='lvm2'/>
        </source>
        <target>
          <path>/dev/{{ vmtool_nvme_vg }}</path>
        </target>
      </pool>
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_pool_info.rc != 0

- name: "Autostart the {{ vmtool_nvme_pool }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-autostart {{ vmtool_nvme_pool }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_pool_info.rc != 0 or vmtool_nvme_pool_info.stdout is search('Autostart:\s+no')

- name: "Start the {{ vmtool_nvme_pool }} pool"
  ansible.builtin.command: "virsh -c qemu:///system pool-start {{ vmtool_nvme_pool }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_pool_info.rc != 0 or vmtool_nvme_pool_info.stdout is search('State:\s+inactive')

# ---------------------------------------------------------------- thin pool

# Opt-in (vmtool_nvme_thin): an LVM thin pool in the volume group, tagged
# vmtool_thinpool, for the daemon's thin clones. libvirt's logical pool neither
# lists nor creates thin pools, so none of this touches the libvirt pool above.
# The writes are `lvcreate --type thin-pool` and, on an adopted pool,
# `lvchange --zero n`, `lvchange --metadataprofile` and `lvchange --discards
# passdown`. Before a pool that does not exist yet, one scratch volume
# (vmtool-discard-scratch, tagged vmtool_scratch) over the free space is made,
# discarded and removed, and nothing else is ever discarded or removed;
# nothing is reduced, forced or wiped.
- name: "Thin pool: install thin-provisioning-tools"
  ansible.builtin.apt:
    name: thin-provisioning-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

- name: "Thin pool: install the LVM profile"
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/vmtool-thin.profile"
    dest: /etc/lvm/profile/vmtool-thin.profile
    owner: root
    group: root
    mode: "0644"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

- name: "Thin pool: enable lvm2-monitor"
  ansible.builtin.systemd:
    name: lvm2-monitor
    enabled: true
    state: started
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

# Read-only. A missing pool makes lvs fail (rc != 0), which means "absent".
- name: "Thin pool: probe the pool LV"
  ansible.builtin.command:
    argv:
      - lvs
      - --reportformat
      - json
      - -o
      - "lv_name,lv_attr,lv_tags,zero,lv_profile,discards"
      - "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"
  register: vmtool_nvme_thin_probe
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

# No regular expressions: the JSON is parsed. adoptable is a thin pool (lv_attr
# starts with t) that carries the vmtool_thinpool tag; zeroing is true while
# the pool still zeroes new chunks.
- name: "Thin pool: read the probe"
  ansible.builtin.set_fact:
    vmtool_nvme_thin_present: "{{ vmtool_nvme_thin_probe.rc == 0 }}"
    vmtool_nvme_thin_adoptable: "{{ (_lv.lv_attr | default(''))[:1] == 't' and 'vmtool_thinpool' in ((_lv.lv_tags | default('')).split(',')) }}"
    vmtool_nvme_thin_zeroing: "{{ (_lv.zero | default('')) | trim != '' }}"
    vmtool_nvme_thin_profile_now: "{{ (_lv.lv_profile | default('')) | trim }}"
    vmtool_nvme_thin_discards: "{{ (_lv.discards | default('')) | trim }}"
  vars:
    _lv: >-
      {{ ((vmtool_nvme_thin_probe.stdout | from_json).report[0].lv | default([]) | first | default({}))
         if (vmtool_nvme_thin_probe.rc == 0 and (vmtool_nvme_thin_probe.stdout | trim | length > 0)) else {} }}
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

- name: "Thin pool: refuse a logical volume that is not a vmtool thin pool"
  ansible.builtin.fail:
    msg: >-
      {{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }} already exists but is not
      a thin pool tagged vmtool_thinpool, so it is not adopted. Nothing was
      changed; rename or tag it yourself, or set vmtool_nvme_thin_pool to
      another name.
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_present | bool
    - not (vmtool_nvme_thin_adoptable | bool)

# Once, before a pool that does not exist yet: the drives hold old data, and a
# pool made without zeroing hands it out. A scratch volume over all the VG's
# free space is discarded (the drives are assumed to return zeros for what is
# discarded) and removed, so the pool's space starts discarded. None of this
# runs when the pool exists. A leftover scratch volume of an interrupted run
# is reused (it is discarded again and removed); one without the vmtool_scratch
# tag is somebody's own and fails the play. The scratch volume is made without
# zeroing or signature wiping, so nothing prompts and nothing is written.
- name: "Thin pool: look for a leftover scratch volume"
  ansible.builtin.command:
    argv: [lvs, --noheadings, -o, lv_tags, "{{ vmtool_nvme_vg }}/vmtool-discard-scratch"]
  register: vmtool_nvme_scratch_probe
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)

# No regular expressions: the tag list is split on commas.
- name: "Thin pool: read the leftover scratch volume"
  ansible.builtin.set_fact:
    vmtool_nvme_scratch_present: "{{ vmtool_nvme_scratch_probe.rc == 0 }}"
    vmtool_nvme_scratch_ours: "{{ 'vmtool_scratch' in ((vmtool_nvme_scratch_probe.stdout | default('') | trim).split(',')) }}"
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)

- name: "Thin pool: fail on a scratch volume that vmtool did not make"
  ansible.builtin.fail:
    msg: >-
      {{ vmtool_nvme_vg }}/vmtool-discard-scratch exists without the
      vmtool_scratch tag, so vmtool will not discard or remove it. Nothing was
      changed on the pool; rename it yourself and run the play again.
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)
    - vmtool_nvme_scratch_present | bool
    - not (vmtool_nvme_scratch_ours | bool)

- name: "Thin pool: create the discard scratch volume"
  ansible.builtin.command:
    argv: [lvcreate, -l, 100%FREE, -n, vmtool-discard-scratch, --zero, "n", --wipesignatures, "n", --addtag, vmtool_scratch, "{{ vmtool_nvme_vg }}"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)
    - not (vmtool_nvme_scratch_present | bool)

# A failure is read, not raised, so the next task can say what to do.
- name: "Thin pool: discard the scratch volume"
  ansible.builtin.command:
    argv: [blkdiscard, "/dev/{{ vmtool_nvme_vg }}/vmtool-discard-scratch"]
  register: vmtool_nvme_scratch_discard
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)

- name: "Thin pool: stop when the scratch discard failed"
  ansible.builtin.fail:
    msg: >-
      Discarding {{ vmtool_nvme_vg }}/vmtool-discard-scratch failed
      ({{ vmtool_nvme_scratch_discard.stderr | default('') | trim }}). The
      scratch volume was left in place and the thin pool was not created.
      The scratch volume holds no data of value: once nothing has it open,
      remove it with `lvremove {{ vmtool_nvme_vg }}/vmtool-discard-scratch`
      and run the play again.
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)
    - vmtool_nvme_scratch_discard.rc | default(0) != 0

# Only after a discard that succeeded.
- name: "Thin pool: remove the scratch volume"
  ansible.builtin.command:
    argv: [lvremove, -y, "{{ vmtool_nvme_vg }}/vmtool-discard-scratch"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)
    - vmtool_nvme_scratch_discard.rc | default(1) == 0

# -l for a percentage (70%FREE), -L for a size (2T). Zeroing off, because it
# halves sequential writes; the profile and monitoring grow the pool.
# Discards pass down to the drives, written out instead of left to the default.
# No --errorwhenfull here: LVM 2.03.16 refuses it on a thin-pool create; the
# tasks after it set it, only if the pool is not at queue already.
- name: "Thin pool: create the pool"
  ansible.builtin.command:
    argv: >-
      {{ ['lvcreate', '--type', 'thin-pool', '-n', vmtool_nvme_thin_pool]
         + ['-l' if '%' in (vmtool_nvme_thin_size | string) else '-L', vmtool_nvme_thin_size | string]
         + ['--chunksize', vmtool_nvme_thin_chunk, '--poolmetadatasize', vmtool_nvme_thin_metadata,
            '--zero', 'n', '--discards', 'passdown', '--monitor', 'y',
            '--metadataprofile', 'vmtool-thin', '--addtag', 'vmtool_thinpool', vmtool_nvme_vg] }}
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - not (vmtool_nvme_thin_present | bool)

# Read-only, after the create, so it serves a pool made just now and an adopted
# one alike. It fails only where no pool exists yet (check mode on a first
# run); the next task then runs nothing.
- name: "Thin pool: read when full after the create"
  ansible.builtin.command:
    argv: [lvs, --reportformat, json, -o, lv_when_full, "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  register: vmtool_nvme_thin_when_full_read
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

# Queue writes when full (LVM's default) only if the pool is not at queue
# already: LVM refuses `--errorwhenfull n` on a pool at queue ("Error when
# full is already unset", exit 5), which a fresh pool is unless the host's
# lvm.conf says otherwise. A rerun runs nothing.
- name: "Thin pool: queue writes when full"
  ansible.builtin.command:
    argv: [lvchange, --errorwhenfull, "n", "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  vars:
    _when_full: >-
      {{ (((vmtool_nvme_thin_when_full_read.stdout | from_json).report[0].lv | default([]) | first | default({})).lv_when_full | default('') | trim)
         if (vmtool_nvme_thin_when_full_read.rc | default(1) == 0 and (vmtool_nvme_thin_when_full_read.stdout | default('') | trim | length > 0)) else '' }}
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_when_full_read.rc | default(1) == 0
    - _when_full != 'queue'

- name: "Thin pool: turn zeroing off on an adopted pool"
  ansible.builtin.command:
    argv: [lvchange, --zero, "n", "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_adoptable | bool
    - vmtool_nvme_thin_zeroing | bool

- name: "Thin pool: attach the profile to an adopted pool"
  ansible.builtin.command:
    argv: [lvchange, --metadataprofile, vmtool-thin, "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_adoptable | bool
    - vmtool_nvme_thin_profile_now != 'vmtool-thin'

# A pool at ignore must be inactive to change; LVM's refusal is read, not
# raised, so the next task can say so plainly.
- name: "Thin pool: pass discards down on an adopted pool"
  ansible.builtin.command:
    argv: [lvchange, --discards, passdown, "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  register: vmtool_nvme_thin_discards_change
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_adoptable | bool
    - vmtool_nvme_thin_discards != 'passdown'

- name: "Thin pool: stop when LVM would not set discards"
  ansible.builtin.fail:
    msg: >-
      LVM would not set discards to passdown on {{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}
      (it is at '{{ vmtool_nvme_thin_discards }}': {{ vmtool_nvme_thin_discards_change.stderr | default('') | trim }}).
      A pool at ignore must be inactive to change: deactivate it, which needs
      every volume in it closed, and run the play again. Nothing was changed on the pool.
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool
    - vmtool_nvme_thin_adoptable | bool
    - vmtool_nvme_thin_discards_change.rc | default(0) != 0

- name: "Thin pool: read size and usage"
  ansible.builtin.command:
    argv: [lvs, -o, "lv_name,lv_size,data_percent,metadata_percent", "{{ vmtool_nvme_vg }}/{{ vmtool_nvme_thin_pool }}"]
  register: vmtool_nvme_thin_final
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - vmtool_nvme_drives | length > 0
    - vmtool_nvme_thin | bool

# ------------------------------------------------------------------ summary

- name: Read the volume group
  ansible.builtin.command:
    argv: [vgs, "{{ vmtool_nvme_vg }}"]
  register: vmtool_nvme_vg_final
  changed_when: false
  check_mode: false
  failed_when: false
  when: vmtool_nvme_drives | length > 0

- name: Read the pool
  ansible.builtin.command: "virsh -c qemu:///system pool-info {{ vmtool_nvme_pool }}"
  register: vmtool_nvme_pool_final
  changed_when: false
  check_mode: false
  failed_when: false
  when: vmtool_nvme_drives | length > 0

- name: Show the NVMe volume group and pool
  ansible.builtin.debug:
    msg: >-
      {{ vmtool_nvme_vg_final.stdout_lines | default([]) + vmtool_nvme_pool_final.stdout_lines | default([])
         + vmtool_nvme_thin_final.stdout_lines | default([])
         + ['Logical volumes in ' ~ vmtool_nvme_vg ~ ' that vmtool did not create (for example test leftovers) are yours to keep or remove; this play never touches them.'] }}
  when: vmtool_nvme_drives | length > 0
