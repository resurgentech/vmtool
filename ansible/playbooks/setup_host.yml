---
# Prepare a machine to *run* vmtool: packages, libvirt daemon, group membership,
# and the libvirt "default" network and storage pool that vmtool assumes exist.
#
#   ansible-playbook ansible/playbooks/setup_host.yml -K
#   ansible-playbook ansible/playbooks/setup_host.yml -K -e vmtool_install_go=true
#   ansible-playbook ansible/playbooks/setup_host.yml -K \
#     -e '{"vmtool_extra_pools":[{"name":"fast","path":"/srv/vms"}]}'
#
# With -e vmtool_role=hypervisor (what `just prereqs <host>` passes) it also
# prepares the box to run the daemon: system user `vmtool`, /opt/vmtool, the
# libvirt dir pool `vmtool` under /var/lib/vmtool/images (instead of a `default`
# pool), and Go only when none at or above vmtool_go_min is found.
#
# Optional, for hypervisors with blank NVMe drives (Debian/Ubuntu only):
#
#   just prereqs veritech02 -e '{"vmtool_nvme_drives":["/dev/disk/by-id/nvme-A","/dev/disk/by-id/nvme-B"]}'
#
# That builds an md RAID 0 stripe, a volume group on it and a libvirt `logical`
# pool `nvme` (tasks/nvme_stripe.yml). It is destructive by nature, runs only
# with the drives named, and refuses non-blank drives. Without the variable
# nothing of this runs.
#
# Supports Ubuntu/Debian and Omarchy/Arch. Safe to re-run.
- name: Install vmtool host prerequisites
  hosts: "{{ vmtool_hosts | default('localhost') }}"
  become: true
  gather_facts: true

  vars:
    # Account that will run vmtool; it is what gets added to the libvirt group.
    vmtool_user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id, true) }}"

    # "" (workstation / local: the default pool, login user in libvirt) or
    # "hypervisor" (also the vmtool user, vmtool_hv_dir and the vmtool pool).
    vmtool_role: ""
    vmtool_hv_user: vmtool
    vmtool_hv_dir: /opt/vmtool
    vmtool_hv_pool_dir: /var/lib/vmtool/images

    # Path backing the libvirt "default" dir pool. vmtool clones images here.
    vmtool_pool_path: /var/lib/libvirt/images

    # Additional dir pools: [{name: fast, path: /srv/vms}, ...]
    vmtool_extra_pools: []

    # Fast block disks, off unless vmtool_nvme_drives is non-empty: a list of
    # /dev/disk/by-id/ paths (at least 2, whole and blank) to stripe with md
    # RAID 0, put an LVM volume group on, and expose as a libvirt `logical`
    # pool. An existing volume group or pool of that name is adopted.
    vmtool_nvme_drives: []
    vmtool_nvme_vg: vmtool-nvme
    vmtool_nvme_md: vmtool-nvme    # /dev/md/<name>
    vmtool_nvme_pool: nvme

    # Opt-in: also make an LVM thin pool in that volume group (tagged
    # vmtool_thinpool) for the daemon's thin clones. Needs vmtool_nvme_drives
    # (an existing volume group is adopted). The size is any lvcreate -l / -L
    # value: 70%FREE is 70 % of the volume group's free space when the pool is
    # created; a size such as 2T works too.
    vmtool_nvme_thin: false
    vmtool_nvme_thin_pool: nvme-thin
    vmtool_nvme_thin_size: 70%FREE
    vmtool_nvme_thin_chunk: 512k
    vmtool_nvme_thin_metadata: 8G

    # Drop /etc/profile.d/vmtool.sh so bare `virsh` matches vmtool (qemu:///system).
    vmtool_set_default_uri: true

    # Open DHCP/DNS and forwarding for the guest bridge when ufw is active.
    # Without this, guests boot with no IP on a default-deny host.
    vmtool_configure_firewall: true
    vmtool_bridge: virbr0

    # Port of the vmtool daemon to open in ufw (when ufw is active). Empty = do
    # nothing; `just prereqs <host>` sets 9473.
    vmtool_daemon_port: ""

    # Off by default. On Debian/Ubuntu this installs the upstream Go tarball
    # (only when the Go that `deploy` would use is missing or older than
    # vmtool_go_min); on Arch it means pacman's `go`.
    vmtool_install_go: false
    vmtool_go_min: "1.21"
    vmtool_go_install_version: "1.24.0"

    # Is the `go env GOVERSION` output in vmtool_go_raw (go1.22.2, go1.24rc1,
    # "" when Go is missing) at or above vmtool_go_min? Release-candidate and
    # beta suffixes are ignored: go1.24rc1 counts as 1.24. Anything that does
    # not start with go<digit> counts as no Go. Tested in scripts/prereqs_test.go.
    vmtool_go_ok: >-
      {{ (vmtool_go_raw | default('', true) | trim | regex_replace('^go', '')
          | regex_replace('^([0-9]+([.][0-9]+)*).*$', '\1')) is version(vmtool_go_min, '>=')
         if (vmtool_go_raw | default('', true) | trim is match('^go[0-9]'))
         else false }}

    # Extras for packer_images/run (image building), not for running vmtool.
    vmtool_install_packer_deps: false

    # Set false on a host without hardware virtualization.
    vmtool_require_kvm: true

    vmtool_packages_debian:
      - qemu-kvm
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - libvirt-dev          # C headers for the Go bindings
      - pkg-config           # cgo needs it to find libvirt
      - dnsmasq-base         # DHCP/DNS for the default NAT network
      - bridge-utils
      - ansible              # vmtool shells out to ansible-playbook
      - sshpass              # vmtool shells out to sshpass for password SSH
      - openssh-client
      - ovmf                 # UEFI firmware for VMs and packer builds

    vmtool_packages_arch:
      - libvirt              # daemon and headers are one package on Arch
      - pkgconf
      - qemu-desktop         # qemu-full only adds non-x86 targets
      - dnsmasq
      - iptables-nft         # optional dep of libvirt the NAT network needs
      - ansible
      - sshpass
      - openssh
      - edk2-ovmf            # UEFI firmware for VMs and packer builds

    vmtool_packages_go_arch: [go]
    vmtool_packages_packer_debian: [gettext-base, openssl]
    vmtool_packages_packer_arch: [gettext, openssl, packer]

    # Matches Manager.EnsureDefaultNetwork in pkg/vmtool/libvirt.go.
    vmtool_network_xml: |
      <network>
        <name>default</name>
        <forward mode='nat'>
          <nat>
            <port start='1024' end='65535'/>
          </nat>
        </forward>
        <bridge name='virbr0' stp='on' delay='0'/>
        <ip address='192.168.122.1' netmask='255.255.255.0'>
          <dhcp>
            <range start='192.168.122.2' end='192.168.122.254'/>
          </dhcp>
        </ip>
      </network>

  tasks:

    # ---------------------------------------------------------------- preflight

    # Omarchy reports as Archlinux via /etc/arch-release, but derivatives that
    # ship neither that file nor a known ID still carry ID_LIKE=arch.
    - name: Read /etc/os-release
      ansible.builtin.slurp:
        src: /etc/os-release
      register: vmtool_os_release

    - name: Classify the package family
      ansible.builtin.set_fact:
        vmtool_family: >-
          {%- if ansible_facts.os_family == 'Debian' or 'debian' in _like or 'ubuntu' in _like
                 or _id in ['debian', 'ubuntu'] -%}
          debian
          {%- elif ansible_facts.os_family == 'Archlinux' or 'arch' in _like or _id == 'arch' -%}
          arch
          {%- else -%}
          unsupported
          {%- endif -%}
      vars:
        _osr: "{{ vmtool_os_release.content | b64decode }}"
        _lines: "{{ _osr.splitlines() }}"
        _id: "{{ (_lines | select('match', 'ID=') | first | default('ID=')).split('=', 1)[1] | replace('\"', '') }}"
        _like: "{{ (_lines | select('match', 'ID_LIKE=') | first | default('ID_LIKE=')).split('=', 1)[1] | replace('\"', '') }}"

    - name: Fail on an unsupported distribution
      ansible.builtin.fail:
        msg: >-
          {{ ansible_facts.distribution }} is not supported by this playbook
          (Ubuntu/Debian and Omarchy/Arch only).
      when: vmtool_family == 'unsupported'

    - name: Check for /dev/kvm
      ansible.builtin.stat:
        path: /dev/kvm
      register: vmtool_kvm

    - name: Fail when hardware virtualization is unavailable
      ansible.builtin.fail:
        msg: >-
          /dev/kvm is missing. Enable VT-x/AMD-V in firmware, or re-run with
          -e vmtool_require_kvm=false to continue without it.
      when:
        - vmtool_require_kvm | bool
        - not vmtool_kvm.stat.exists

    - name: Require a non-root vmtool user
      ansible.builtin.fail:
        msg: "Could not determine the vmtool user; pass -e vmtool_user=<name>."
      when: vmtool_user | default('', true) in ['', 'root']

    # ---------------------------------------------------------------- packages

    - name: Build the package list
      ansible.builtin.set_fact:
        vmtool_packages: "{{ _base + _go + _packer }}"
      vars:
        _debian: "{{ vmtool_family == 'debian' }}"
        _base: "{{ _debian | ternary(vmtool_packages_debian, vmtool_packages_arch) }}"
        _go: "{{ ((vmtool_install_go | bool) and not _debian) | ternary(vmtool_packages_go_arch, []) }}"
        _packer: "{{ (vmtool_install_packer_deps | bool)
                     | ternary(_debian | ternary(vmtool_packages_packer_debian,
                                                 vmtool_packages_packer_arch), []) }}"

    - name: Install packages (Debian/Ubuntu)
      ansible.builtin.apt:
        name: "{{ vmtool_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: vmtool_family == 'debian'

    # pacman lives in community.general, which ansible-core alone does not ship,
    # so drive it directly. `pacman -T` prints only what is missing, which keeps
    # this idempotent without changed_when guesswork.
    - name: Find missing packages (Arch/Omarchy)
      ansible.builtin.command:
        argv: "{{ ['pacman', '-T'] + vmtool_packages }}"
      register: vmtool_pacman_missing
      changed_when: false
      check_mode: false
      failed_when: vmtool_pacman_missing.rc not in [0, 127]
      when: vmtool_family == 'arch'

    - name: Install packages (Arch/Omarchy)
      ansible.builtin.command:
        argv: "{{ ['pacman', '-S', '--needed', '--noconfirm'] + vmtool_pacman_missing.stdout_lines }}"
      when:
        - vmtool_family == 'arch'
        - vmtool_pacman_missing.stdout_lines | default([]) | length > 0

    - name: Note that packer is not packaged for Debian/Ubuntu
      ansible.builtin.debug:
        msg: >-
          packer is not in the Debian/Ubuntu archive. Add HashiCorp's apt repo
          (https://developer.hashicorp.com/packer/install) before using
          packer_images/run.
      when:
        - vmtool_install_packer_deps | bool
        - vmtool_family == 'debian'

    # ------------------------------------------------------------------ daemon

    - name: List installed systemd units
      ansible.builtin.command: systemctl list-unit-files --no-legend --no-pager
      register: vmtool_units
      changed_when: false
      check_mode: false

    # Both distros socket-activate libvirtd; the .service unit is only touched
    # where it exists, so this survives libvirt's modular-daemon layouts.
    - name: Enable and start libvirt units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - libvirtd.socket
        - libvirtd-ro.socket
        - virtlogd.socket
        - libvirtd.service
      when: vmtool_units.stdout is search('^' ~ (item | regex_escape), multiline=True)

    - name: Wait for the system libvirt socket
      ansible.builtin.command: virsh -c qemu:///system version
      register: vmtool_virsh
      changed_when: false
      check_mode: false
      retries: 10
      delay: 2
      until: vmtool_virsh.rc == 0

    # ------------------------------------------------------------------- users

    - name: Ensure the libvirt group exists
      ansible.builtin.group:
        name: libvirt
        state: present

    # kvm only exists once qemu is installed, and not on every distro.
    - name: Look for a kvm group
      ansible.builtin.getent:
        database: group
        key: kvm
        fail_key: false

    - name: Add "{{ vmtool_user }}" to the libvirt group
      ansible.builtin.user:
        name: "{{ vmtool_user }}"
        groups: "{{ ['libvirt'] + (['kvm'] if _kvm_group is not none else []) }}"
        # A module option: without it the user module replaces the account's
        # supplementary groups (sudo/wheel included).
        append: true
      vars:
        _kvm_group: "{{ ansible_facts.getent_group.kvm | default(none, true) }}"
      register: vmtool_groups

    # ------------------------------------------------------ hypervisor account

    - name: Create the vmtool system group
      ansible.builtin.group:
        name: "{{ vmtool_hv_user }}"
        system: true
        state: present
      when: vmtool_role == 'hypervisor'

    # No login shell. Its only sudo is the one root helper, vmtool-thin, which
    # `just deploy` installs with its sudoers rule (this play sets none up).
    # Home is the install dir but useradd must not create it (the file task
    # below sets its owner and mode).
    - name: Create the vmtool system user
      ansible.builtin.user:
        name: "{{ vmtool_hv_user }}"
        group: "{{ vmtool_hv_user }}"
        groups: "{{ ['libvirt'] + (['kvm'] if _kvm_group is not none else []) }}"
        append: true
        system: true
        shell: /usr/sbin/nologin
        home: "{{ vmtool_hv_dir }}"
        create_home: false
        state: present
      vars:
        _kvm_group: "{{ ansible_facts.getent_group.kvm | default(none, true) }}"
      when: vmtool_role == 'hypervisor'

    - name: Look up the vmtool uid and gid
      ansible.builtin.getent:
        database: passwd
        key: "{{ vmtool_hv_user }}"
        fail_key: false
      when: vmtool_role == 'hypervisor'

    - name: Create the vmtool directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ vmtool_hv_dir }}", owner: "{{ vmtool_hv_user }}", mode: "0750"}
        - {path: "{{ vmtool_hv_dir }}/tls", owner: "{{ vmtool_hv_user }}", mode: "0700"}
        - {path: /var/lib/vmtool, owner: root, mode: "0711"}
      loop_control:
        label: "{{ item.path }}"
      when: vmtool_role == 'hypervisor'

    # ----------------------------------------------------------------------- go

    # Find the Go `deploy` will use: /usr/local/go first, else the login user's
    # PATH, as that user (no become) in a login shell.
    - name: Find the Go that deploy would use
      ansible.builtin.command:
        argv:
          - bash
          - -lc
          - 'if [ -x /usr/local/go/bin/go ]; then g=/usr/local/go/bin/go; else g=go; fi; "$g" env GOVERSION'
      become: false
      register: vmtool_go_found
      changed_when: false
      check_mode: false
      failed_when: false
      when:
        - vmtool_install_go | bool
        - vmtool_family == 'debian'

    - name: Record the Go version found
      ansible.builtin.set_fact:
        vmtool_go_raw: "{{ (vmtool_go_found.stdout_lines | default([])) | last | default('') if vmtool_go_found.rc | default(1) == 0 else '' }}"
      when:
        - vmtool_install_go | bool
        - vmtool_family == 'debian'

    - name: Report the Go decision
      ansible.builtin.debug:
        msg: >-
          Go found: {{ vmtool_go_raw | default('', true) | trim | default('none', true) }};
          minimum {{ vmtool_go_min }}; {{ 'leaving it alone' if vmtool_go_ok | bool
          else 'installing ' ~ vmtool_go_install_version }}.
      when:
        - vmtool_install_go | bool
        - vmtool_family == 'debian'

    - name: Install the upstream Go toolchain
      when:
        - vmtool_install_go | bool
        - vmtool_family == 'debian'
        - not (vmtool_go_ok | bool)
      vars:
        _arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] | default('') }}"
        _tarball: "go{{ vmtool_go_install_version }}.linux-{{ _arch }}.tar.gz"
        _url: "https://dl.google.com/go/{{ _tarball }}"
      block:
        - name: Fail on an architecture without an upstream Go tarball
          ansible.builtin.fail:
            msg: "No upstream Go tarball for {{ ansible_facts.architecture }}."
          when: _arch == ''

        - name: Make a download directory
          ansible.builtin.tempfile:
            state: directory
            prefix: vmtool-go.
          register: vmtool_go_tmp

        # checksum: the published .sha256 file, verified by get_url.
        - name: Download the Go tarball
          ansible.builtin.get_url:
            url: "{{ _url }}"
            dest: "{{ vmtool_go_tmp.path }}/{{ _tarball }}"
            checksum: "sha256:{{ _url }}.sha256"
            mode: "0600"

        - name: Remove the old /usr/local/go
          ansible.builtin.file:
            path: /usr/local/go
            state: absent

        - name: Unpack Go into /usr/local
          ansible.builtin.unarchive:
            src: "{{ vmtool_go_tmp.path }}/{{ _tarball }}"
            dest: /usr/local
            remote_src: true
      always:
        - name: Remove the download directory
          ansible.builtin.file:
            path: "{{ vmtool_go_tmp.path }}"
            state: absent
          when: vmtool_go_tmp.path is defined

    - name: Point bare virsh at qemu:///system
      ansible.builtin.copy:
        dest: /etc/profile.d/vmtool.sh
        mode: "0644"
        content: |
          # Managed by ansible/playbooks/setup_host.yml
          # vmtool always uses qemu:///system; make virsh agree.
          export LIBVIRT_DEFAULT_URI=qemu:///system
      when: vmtool_set_default_uri | bool

    # ----------------------------------------------------------------- network

    - name: Inspect the default network
      ansible.builtin.command: virsh -c qemu:///system net-info default
      register: vmtool_net_info
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Define the default network
      when: vmtool_net_info.rc != 0
      block:
        - name: Stage the default network XML
          ansible.builtin.copy:
            dest: /tmp/vmtool-default-net.xml
            content: "{{ vmtool_network_xml }}"
            mode: "0600"

        - name: Register the default network with libvirt
          ansible.builtin.command: virsh -c qemu:///system net-define /tmp/vmtool-default-net.xml
      always:
        - name: Remove the staged network XML
          ansible.builtin.file:
            path: /tmp/vmtool-default-net.xml
            state: absent

    - name: Autostart the default network
      ansible.builtin.command: virsh -c qemu:///system net-autostart default
      when: vmtool_net_info.rc != 0 or vmtool_net_info.stdout is search('Autostart:\s+no')

    - name: Start the default network
      ansible.builtin.command: virsh -c qemu:///system net-start default
      when: vmtool_net_info.rc != 0 or vmtool_net_info.stdout is search('Active:\s+no')

    # ---------------------------------------------------------------- firewall

    # ufw defaults to deny-incoming and deny-routed, which silently kills the
    # guest's DHCP broadcast (ufw does not even log broadcasts at its default
    # log level) and then its outbound NAT. libvirt's own nftables table cannot
    # override this: at the same hook a drop in ufw's table wins. Omarchy ships
    # ufw enabled, so a fresh vmtool host hits this as "VM never gets an IP".
    - name: Check for an active ufw
      ansible.builtin.command: ufw status
      register: vmtool_ufw
      changed_when: false
      check_mode: false
      failed_when: false
      when: (vmtool_configure_firewall | bool) or (vmtool_daemon_port | string | length > 0)

    - name: Allow libvirt guest traffic through ufw
      ansible.builtin.command: "ufw {{ item.rule }}"
      register: vmtool_ufw_rule
      changed_when: "'Skipping' not in vmtool_ufw_rule.stdout"
      loop:
        - rule: >-
            allow in on {{ vmtool_bridge }} to any port 67 proto udp
            comment 'vmtool libvirt DHCP'
          label: dhcp
        - rule: >-
            allow in on {{ vmtool_bridge }} to any port 53
            comment 'vmtool libvirt DNS'
          label: dns
        - rule: >-
            route allow in on {{ vmtool_bridge }}
            comment 'vmtool guests outbound'
          label: route-in
        - rule: >-
            route allow out on {{ vmtool_bridge }}
            comment 'vmtool guests inbound replies'
          label: route-out
      loop_control:
        label: "{{ item.label }}"
      when:
        - vmtool_configure_firewall | bool
        - vmtool_ufw.rc | default(1) == 0
        - vmtool_ufw.stdout | default('') is search('Status:\s+active')

    - name: Allow the vmtool daemon port through ufw
      ansible.builtin.command: "ufw allow {{ vmtool_daemon_port }}/tcp comment 'vmtool daemon'"
      register: vmtool_ufw_daemon
      changed_when: "'Skipping' not in vmtool_ufw_daemon.stdout"
      when:
        - vmtool_daemon_port | string | length > 0
        - vmtool_ufw.rc | default(1) == 0
        - vmtool_ufw.stdout | default('') is search('Status:\s+active')

    # ------------------------------------------------------------------- pools

    # A hypervisor gets the vmtool pool and no default pool; this never touches
    # any other pool. Its XML names the vmtool uid/gid so pool-build/pool-start
    # keep that ownership.
    - name: Ensure the storage pools
      ansible.builtin.include_tasks: tasks/libvirt_pool.yml
      vars:
        _pw: "{{ (ansible_facts.getent_passwd | default({}))[vmtool_hv_user] | default(['', '', '', '']) }}"
        _default_pool:
          - {name: default, path: "{{ vmtool_pool_path }}"}
        _hv_pool:
          - name: vmtool
            path: "{{ vmtool_hv_pool_dir }}"
            owner: "{{ vmtool_hv_user }}"
            uid: "{{ _pw[1] }}"
            gid: "{{ _pw[2] }}"
            mode: "0711"
      loop: "{{ (_hv_pool if vmtool_role == 'hypervisor' else _default_pool) + vmtool_extra_pools }}"
      loop_control:
        loop_var: pool
        label: "{{ pool.name }} ({{ pool.path }})"

    # Opt-in and destructive by nature: runs only with vmtool_nvme_drives named.
    # See tasks/nvme_stripe.yml.
    - name: Build the NVMe stripe and its logical pool
      ansible.builtin.include_tasks: tasks/nvme_stripe.yml
      when: vmtool_nvme_drives | length > 0

    # ----------------------------------------------------------------- summary

    - name: Collect the resulting libvirt state
      ansible.builtin.command: "virsh -c qemu:///system {{ item }}"
      register: vmtool_state
      changed_when: false
      check_mode: false
      loop:
        - net-list --all
        - pool-list --all

    - name: Show the resulting libvirt state
      ansible.builtin.debug:
        msg: "{{ vmtool_state.results | map(attribute='stdout_lines') | flatten }}"

    - name: Note the pending group membership
      ansible.builtin.debug:
        msg: >-
          {{ vmtool_user }} was added to the libvirt group. Log out and back in
          (or run `newgrp libvirt`) before using vmtool.
      when: vmtool_groups is changed
