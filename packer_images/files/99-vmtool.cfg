# vmtool cloud-init configuration. Installed by every packer template to
# /etc/cloud/cloud.cfg.d/99-vmtool.cfg. The image ends clean for cloud-init
# (cloud-init clean --machine-id), so each clone takes its identity at first
# boot from the SMBIOS serial vmtool sets: ds=nocloud;h=<name>;i=<uuid>.
#
# Named 99-* so it sorts after every file that survives the clean, in
# particular the cloud-init package's 90_dpkg.cfg, which sets its own
# datasource_list (cloud.cfg.d is merged in lexical order; the last wins).
datasource_list: [NoCloud, None]
users: []
ssh_pwauth: true
preserve_hostname: false
manage_etc_hosts: localhost
growpart:
  mode: auto
  devices: ['/']
resize_rootfs: true
