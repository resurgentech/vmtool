# vmtool images keep /tmp on disk (the template masks tmp.mount) and empty it
# at every boot, as Ubuntu 24.04 does; the daily systemd-tmpfiles-clean.timer
# also removes files older than 30 days. Installed to /etc/tmpfiles.d/.
#
# Why "00-": tmpfiles.d takes the first line for a path in lexical file order
# and ignores later ones, so this file must sort before the release's own
# tmp.conf (26.04 ships "q /tmp 1777 root root 10d" there). On 24.04 it
# restates the release's rule. /var/tmp is left to the release.
D /tmp 1777 root root 30d
