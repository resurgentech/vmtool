openapi: 3.0.3
info:
  title: vmtool store API
  version: 1.3.0
  description: >
    HTTP surface of `vmtool-store`, the image and credential store that runs as
    a container behind a TLS-terminating proxy. Spec-first: models, stdlib
    ServerInterface, embedded spec and a client are generated from this file.
    The base URL may carry a path: with `path_prefix` set in the store's
    config (for example `/vmstore`, behind a proxy that serves several
    services on one host and passes the path on unchanged), every path below,
    GET /version included, is served under that prefix
    (`https://proxy.example/vmstore/version`), and any other path, the prefix
    alone included, is 404 before auth. Without it the store serves at the
    root. Clients keep the base URL's path and append the paths below to it.
    Every operation except GET /version requires
    `Authorization: Bearer <token>`; the store checks the token's SHA-256
    against the named hashes in tokens.yaml and answers 401 otherwise. The
    credential routes carry secrets only in the body of a successful GET;
    no other response and no log line does. The one other credential is a
    download ticket, accepted only on the image blob route. A host token
    (one per host, `host_tokens.yaml`) is a limited bearer token: it is
    accepted only on `GET /v1/whoami`, `PUT /v1/hosts/{host}/inventory` and
    `GET /v1/hosts/{host}/networks` (its own host's network memberships);
    on every other route it answers 401, as a ticket does. It reads no
    credential, image or other host.
servers:
  - url: /
    description: >
      The store's base URL, which may carry a path (the store's
      `path_prefix`), for example `https://proxy.example/vmstore`. Every path
      below is relative to it.
security:
  - bearerAuth: []
paths:
  /version:
    get:
      operationId: getVersion
      summary: Reachability probe; public
      security: []
      responses:
        "200":
          description: The store is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/whoami:
    get:
      operationId: whoami
      summary: The name of the calling token
      responses:
        "200":
          description: >
            The caller's name and kind. A user token answers its name from
            tokens.yaml and kind `user`; a host token answers `host/<host>`
            and kind `host`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:
    get:
      operationId: listImages
      summary: List images, ordered by name
      responses:
        "200":
          description: Every indexed image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getImage
      summary: One image's metadata
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putImage
      summary: Upload an image, streamed
      description: >
        The body is streamed to object storage and hashed as it is written;
        it is never buffered in memory or on local disk and has no size cap.
        The image is indexed only when the body's SHA-256 equals
        `X-Image-SHA256` and its length equals `Content-Length`; otherwise the
        new object is deleted and the answer is 400. A push of an existing
        name with a new digest replaces it, and until the new object is
        indexed the old image keeps being served. A push of the digest that
        is already indexed answers 200 without rewriting. One push of a name
        runs at a time; a second answers 409 at once. A request without a
        `Content-Length` (chunked) answers 411.
      parameters:
        - name: X-Image-SHA256
          in: header
          required: true
          description: SHA-256 of the body, 64 lowercase hex characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Content-Length
          in: header
          required: false
          description: Body length in bytes; required (411 when absent).
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The same digest was already indexed; nothing was rewritten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "201":
          description: The image is stored and indexed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another push of this name is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "411":
          description: The request has no Content-Length.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteImage
      summary: Delete an image
      responses:
        "204":
          description: The image is deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A push of this name is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}/blob:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getImageBlob
      summary: Download an image's bytes, streamed
      description: >
        Accepts `Authorization: Bearer <token>`, or
        `Authorization: Ticket <ticket>` for a ticket minted for this image
        and its current SHA-256. A ticket is good for one download. The
        response carries `Content-Length` and `X-Image-SHA256`.
      security:
        - bearerAuth: []
        - ticketAuth: []
      responses:
        "200":
          description: The image bytes.
          headers:
            X-Image-SHA256:
              description: SHA-256 of the body, 64 lowercase hex characters.
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}/tickets:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: createImageTicket
      summary: Mint a download ticket for one image
      description: >
        Needs a bearer token (a ticket never works here). The ticket opens
        only `GET /v1/images/{name}/blob` of this image at its current
        SHA-256, once, for 15 minutes. The store keeps only the ticket's
        SHA-256, in memory; a restart forgets every ticket. This response is
        the only place the ticket is ever shown.
      responses:
        "201":
          description: A new ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/vms/{host}/{name}:
    parameters:
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getVMCredential
      summary: A VM's credentials, if the stored record is for this domain UUID
      description: >
        Answers 404 with `"stale": true` when a record exists for another
        UUID (the VM was recreated); that answer carries no credential field.
        A record whose UUID is not current is never used.
      parameters:
        - name: uuid
          in: query
          required: true
          description: The domain UUID the caller holds now (canonical 8-4-4-4-12 hex).
          schema:
            type: string
      responses:
        "200":
          description: The record. The only response of the store that carries a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No record, or a record for another UUID (`stale`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putVMCredential
      summary: Store a VM's credentials, replacing any record for (host, name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCredentialInput"
      responses:
        "200":
          description: Stored. The body never echoes a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCredentialRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteVMCredential
      summary: Delete a VM's credentials (whatever UUID they are for)
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/machines:
    get:
      operationId: listMachineCredentials
      summary: List metal and alien machines (names and kinds only)
      responses:
        "200":
          description: Every machine record, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/machines/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getMachineCredential
      summary: A machine's manifest and credentials
      responses:
        "200":
          description: The record. Carries secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putMachineCredential
      summary: Store a machine's manifest and credentials, replacing any record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineCredentialInput"
      responses:
        "200":
          description: Stored. The body never echoes a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMachineCredential
      summary: Delete a machine's record
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/hosts/{host}/inventory:
    parameters:
      - $ref: "#/components/parameters/Host"
    put:
      operationId: putHostInventory
      summary: A host daemon reports its full VM list
      description: >
        Only a host token for this very `{host}` may call it (another host's
        token and every user token get 403). The body is the host's whole VM
        list, never a diff: JSON only, at most 1 MiB (413) and 4096 VMs. Each
        listed (host, uuid) is inserted or updated and, if it was gone, listed
        again; each live row of the host that the list omits is marked gone; a
        login of the host that matches no row gets a gone row. A report
        carries no origin and no comment: a VM's notes are written only
        through `PUT /v1/inventory/{host}/{name}/notes`, and no report
        touches them. A VM with
        `disks_unreadable` true keeps the disks the store last had for it
        (the report's `disks` for it is ignored) and is marked; the next
        report that reads its disks clears the mark. Reports are ordered by
        the store's own clock at the time it took the request: one that
        arrives while a later-received report of the same host has already
        been applied is answered 200 with `stale` true and changes nothing.
        `generated_at` is the daemon's own clock; it is stored and shown,
        never used to order or refuse a report. Nothing is marked gone by
        age or silence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostReport"
      responses:
        "200":
          description: Applied (or ignored as stale).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/inventory:
    get:
      operationId: getInventory
      summary: The store's inventory of hosts, VMs and machines
      description: >
        User tokens only. A record of what each host daemon last said, not a
        live view; it carries no up/down state and no staleness mark. Gone
        VMs are listed only with `gone=true`. Hosts, VMs and machines are
        ordered by (host,) name. Machines are not filtered by `host`.
      parameters:
        - name: host
          in: query
          required: false
          description: Only this host's row and VMs.
          schema:
            type: string
        - name: gone
          in: query
          required: false
          description: Also list VMs their host no longer has.
          schema:
            type: boolean
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/inventory/{host}/{name}/delist:
    parameters:
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Name"
    post:
      operationId: delistVM
      summary: Mark a VM's live row gone
      description: >
        User tokens only. Marks the live row of (host, name) gone now; its
        login is kept for 7 days (`credentials_kept_until`), then the sweep
        removes both. 404 when there is no live row.
      responses:
        "200":
          description: The row is gone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Delisted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/inventory/{host}/{name}:
    parameters:
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Name"
    delete:
      operationId: deleteInventoryRow
      summary: Remove a VM's inventory row at once
      description: >
        User tokens only. An explicit delete: the row of (host, name, uuid)
        goes immediately, live or gone, and the VM's notes (origin and
        comment) with it. It leaves the credential record alone (`vmtool
        delete` removes that itself). 404 when there is neither such a row
        nor notes for (host, uuid).
      parameters:
        - name: uuid
          in: query
          required: true
          description: The domain UUID of the row (canonical 8-4-4-4-12 hex).
          schema:
            type: string
      responses:
        "204":
          description: The row is removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/inventory/{host}/{name}/notes:
    parameters:
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Name"
    put:
      operationId: putVMNotes
      summary: Record a VM's origin, or set or clear its comment
      description: >
        User tokens only (a host token gets 401). A VM's notes are what
        vmtool records about it besides what its host reports: its origin
        and its comment, kept in the store only (never in the VM's libvirt
        definition), in plain text, keyed (host, uuid). No report touches
        them; they go with their inventory row (explicit delete, sweep), and
        notes whose row never appears are removed by the sweep 7 days after
        they were last written. With `uuid` (the create's case) the notes
        are stored even before the host's first report has made the row;
        without it the route needs a live row of (host, name) and takes its
        UUID (404 when there is no row at all). A row that is gone takes no
        notes (409). `origin` is written once, at create: accepted only while
        (host, uuid) has none; the same origin again is 200 and changes
        nothing, a different one is 409. `comment` replaces the stored
        comment; empty clears it; absent leaves it. At least one of the two
        is required. Answers the notes as stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMNotesInput"
      responses:
        "200":
          description: The notes as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMNotes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The row is gone, or a different origin is already recorded
            (origin is recorded once, at create). The body is fixed text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks:
    get:
      operationId: listNetworks
      summary: The registered vmtool networks, with their members
      description: >
        User tokens only. Ordered by name; each network carries its members.
      responses:
        "200":
          description: Every registered network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createNetwork
      summary: Register a network and allocate its VNI and subnet
      description: >
        User tokens only. The registry is what keeps two hosts from handing
        out the same VNI or subnet. With no `vni` the store takes the lowest
        free VNI from 10000 up (so the first bridge is `vmt-002710`); with no
        `subnet` it takes the next free /24 of 10.77.0.0/16. A `vni` or
        `subnet` that is given must be free (409 otherwise). `domain` omitted
        is `<name>.test`. `home` is the host whose libvirt network does the
        routing, DHCP and DNS. The allocation and the insert are one
        transaction, so concurrent creates never share a VNI or a subnet. The
        store only records: it does not touch any host and never tracks
        whether a host is up. JSON only, at most 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkInput"
      responses:
        "201":
          description: The network, as registered (no members yet).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >
            The name, a given VNI or a given subnet is taken, or no VNI or
            /24 is free. The body is fixed text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getNetwork
      summary: One registered network, with its members
      description: User tokens only.
      responses:
        "200":
          description: The network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNetwork
      summary: Remove a network from the registry
      description: >
        User tokens only. Refused (409) while the network has members. Frees
        its VNI and subnet for a later create.
      responses:
        "204":
          description: The network is removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The network still has members. The body is fixed text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}/members/{host}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Host"
    put:
      operationId: putNetworkMember
      summary: Add a host to a network, or update its LAN address
      description: >
        User tokens only. Records the host's LAN address and the interface
        that address is on (the underlay of its VXLAN link). A host that is
        already a member keeps its `joined` time and takes the new address
        and interface. The home host may be a member too. The store does not
        reach the host and records nothing about whether it is up. JSON only,
        at most 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkMemberInput"
      responses:
        "200":
          description: The member, as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNetworkMember
      summary: Remove a host from a network
      description: User tokens only.
      responses:
        "204":
          description: The host is no longer a member.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}/reservations:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: listNetworkReservations
      summary: A network's recorded reservations
      description: >
        User tokens only. The copy the store keeps of the reservations of a
        network that spans hosts (network, MAC, address, host, VM), so a client
        can answer without reaching the home. The home's own DHCP
        configuration is the source of truth; this is a record made when a
        reservation is made or removed by a client.
      responses:
        "200":
          description: The reservations, ordered by address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkReservationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}/reservations/orphaned:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: listOrphanedNetworkReservations
      summary: A network's orphaned reservations
      description: >
        User tokens only. The recorded reservations of the network that are
        marked orphaned (`orphaned_at` set), in address order. A reservation is
        orphaned only on a positive fact the store holds: a client marked it
        (its `delete` or a failed undo could not remove it on the home), or the
        inventory sweep removed the gone row of the VM whose `uuid` it carries.
        A host that is silent marks nothing. A client that reaches the home
        removes these on the home and then deletes their records.
      responses:
        "200":
          description: The orphaned reservations, ordered by address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkReservationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}/reservations/{mac}/orphan:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Mac"
    post:
      operationId: markNetworkReservationOrphaned
      summary: Mark a recorded reservation orphaned
      description: >
        User tokens only. Sets `orphaned_at` to now on the record of `mac`; one
        already marked keeps its first time. Records what the caller knows (a
        reservation it could not remove on the home); the store reaches no host.
      responses:
        "200":
          description: The reservation, as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkReservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/networks/{name}/reservations/{mac}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/Mac"
    put:
      operationId: putNetworkReservation
      summary: Record a reservation of a network
      description: >
        User tokens only. Records that `mac` has `ip` on the network for VM
        `vm` of `host`. Idempotent: a MAC already recorded takes the new
        values. An address another MAC holds on the network is 409. The store
        does not reach any host and does not make the reservation; the client
        records what the home's daemon made. JSON only, at most 1 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkReservationInput"
      responses:
        "200":
          description: The reservation, as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkReservation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Another MAC holds that address on the network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteNetworkReservation
      summary: Remove a recorded reservation
      description: User tokens only.
      responses:
        "204":
          description: The record is gone.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/hosts/{host}/networks:
    parameters:
      - $ref: "#/components/parameters/Host"
    get:
      operationId: getHostNetworks
      summary: The networks one host belongs to, with its peers' LAN addresses
      description: >
        The one read a host token has beyond its report: a host token for this
        very `{host}` (another host's token gets 403; a user token may name
        any host). Only the networks the host is a member of or the home of,
        each with VNI, bridge, subnet, domain, home, the host's own LAN
        address and interface when it is a member, and the other members'
        host names and LAN addresses (`peers`). Read-only; nothing else of
        the registry, no network the host is not part of, no reservation, no
        VM, and no up/down state. A host with no network gets an empty list.
      responses:
        "200":
          description: The host's networks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostNetworks"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    ticketAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Authorization: Ticket <ticket>`; accepted only by
        GET /v1/images/{name}/blob.
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Host:
      name: host
      in: path
      required: true
      schema:
        type: string
    Mac:
      name: mac
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed. The body names the field only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The token may not do this; the body is fixed text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such image, VM record, inventory row or machine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The store failed; the body is fixed text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body is over the size limit; the body is fixed text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Image:
      type: object
      required: [name, sha256, size, updated]
      properties:
        name:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
        updated:
          type: string
          format: date-time
    ImageList:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    Ticket:
      type: object
      required: [ticket, expires_at, image, sha256, size]
      properties:
        ticket:
          type: string
        expires_at:
          type: string
          format: date-time
        image:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
    CredentialNotFound:
      type: object
      required: [error]
      properties:
        error:
          type: string
        stale:
          type: boolean
          description: True only when a record exists for another UUID.
    VMCredentialInput:
      type: object
      required: [uuid, username]
      properties:
        uuid:
          type: string
          description: The libvirt domain UUID these credentials belong to.
        username:
          type: string
          maxLength: 65536
        password:
          type: string
          maxLength: 65536
        private_key:
          type: string
          maxLength: 65536
        public_key:
          type: string
          maxLength: 65536
    VMCredential:
      type: object
      required: [host, name, uuid, username, password, private_key, public_key, updated]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        username:
          type: string
        password:
          type: string
        private_key:
          type: string
        public_key:
          type: string
        updated:
          type: string
          format: date-time
    VMCredentialRef:
      type: object
      required: [host, name, uuid, updated]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        updated:
          type: string
          format: date-time
    MachineCredentialInput:
      type: object
      required: [kind, address, username]
      properties:
        kind:
          type: string
          enum: [metal, alien]
        address:
          type: string
          maxLength: 1024
        username:
          type: string
          maxLength: 65536
        password:
          type: string
          maxLength: 65536
        private_key:
          type: string
          maxLength: 65536
        public_key:
          type: string
          maxLength: 65536
    MachineCredential:
      type: object
      required: [name, kind, address, username, password, private_key, public_key, updated]
      properties:
        name:
          type: string
        kind:
          type: string
        address:
          type: string
        username:
          type: string
        password:
          type: string
        private_key:
          type: string
        public_key:
          type: string
        updated:
          type: string
          format: date-time
    MachineRef:
      type: object
      required: [name, kind, updated]
      properties:
        name:
          type: string
        kind:
          type: string
        updated:
          type: string
          format: date-time
    MachineSummary:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
    MachineList:
      type: object
      required: [machines]
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/MachineSummary"
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Whoami:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [user, host]
          description: >
            Which kind of token called. Absent from a store older than
            1.1.0, which has only user tokens.
    Disk:
      type: object
      required: [target, pool, capacity_bytes, kind]
      properties:
        target:
          type: string
        pool:
          type: string
        capacity_bytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [file, block, thin]
    VMOrigin:
      type: object
      description: >
        What a VM was made from; known only when vmtool created it with a
        store in use. Each field at most 512 bytes on one line.
      properties:
        image:
          type: string
        image_sha256:
          type: string
        template:
          type: string
        clone:
          type: string
          description: thin, block, file or none.
        pool:
          type: string
        created:
          type: string
          description: Creation time (RFC 3339) as the workstation's create wrote it.
    VMNotesInput:
      type: object
      properties:
        uuid:
          type: string
          description: >
            The libvirt domain UUID. Given by create, which knows it before the
            host's first report; without it a live row of (host, name) is needed.
        origin:
          $ref: "#/components/schemas/VMOrigin"
        comment:
          type: string
          maxLength: 512
          description: >
            At most 512 bytes of UTF-8 on one line, no control characters.
            Empty clears it; absent leaves it. Not a secret: stored in plain
            text.
    VMNotes:
      type: object
      required: [host, name, uuid, comment]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        origin:
          $ref: "#/components/schemas/VMOrigin"
        comment:
          type: string
    ReportVM:
      type: object
      required: [name, uuid, state, vcpus, memory, ip, autostart, firmware, disks]
      properties:
        name:
          type: string
          description: >-
            The libvirt name: any name libvirt allows, at most 128 bytes of
            UTF-8 on one line, no control character and no '/'. Not limited
            to the names vmtool gives, so a VM made outside vmtool does not
            cost its host the whole report.
        uuid:
          type: string
        state:
          type: string
        vcpus:
          type: integer
        memory:
          type: integer
          description: Memory in GiB.
        ip:
          type: string
        autostart:
          type: boolean
        firmware:
          type: string
        disks:
          type: array
          items:
            $ref: "#/components/schemas/Disk"
        disks_unreadable:
          type: boolean
          description: >
            True when the daemon could not read this VM's disks (other than
            the VM having just vanished). `disks` is then empty and ignored:
            the store keeps its last known disks for the VM and marks it.
            Absent or false means the disks were read.
        networks:
          type: array
          maxItems: 64
          description: >
            The VM's cards on vmtool networks (a network whose bridge is
            `vmt-` plus six lowercase hex digits), with each card's fixed
            address. Absent or empty means none; a report replaces what the
            store had.
          items:
            $ref: "#/components/schemas/VMNetwork"
    VMNetwork:
      type: object
      required: [network, mac, ip]
      properties:
        network:
          type: string
        mac:
          type: string
        ip:
          type: string
          description: Empty when the card has no reservation.
    HostReport:
      type: object
      required: [generated_at, daemon_version, vms]
      properties:
        generated_at:
          type: string
          format: date-time
        daemon_version:
          type: string
        vms:
          type: array
          maxItems: 4096
          items:
            $ref: "#/components/schemas/ReportVM"
    ReportResult:
      type: object
      required: [listed, newly_gone, relisted, stale]
      properties:
        listed:
          type: integer
        newly_gone:
          type: integer
        relisted:
          type: integer
        stale:
          type: boolean
          description: True when a report of the same host received later had already been applied, so this one was ignored.
    InventoryHost:
      type: object
      required: [name, last_report, daemon_version, live, gone]
      properties:
        name:
          type: string
        last_report:
          type: string
          format: date-time
        daemon_version:
          type: string
        live:
          type: integer
        gone:
          type: integer
    InventoryVM:
      type: object
      required: [host, name, uuid, state, vcpus, memory, ip, autostart, firmware, disks, comment, first_seen, last_seen, has_credentials]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        state:
          type: string
        vcpus:
          type: integer
        memory:
          type: integer
          description: Memory in GiB.
        ip:
          type: string
        autostart:
          type: boolean
        firmware:
          type: string
        disks:
          type: array
          items:
            $ref: "#/components/schemas/Disk"
        disks_unreadable:
          type: boolean
          description: >
            Present and true when the host could not read this VM's disks at
            its last report; `disks` are then the last known ones.
        networks:
          type: array
          description: >
            The VM's cards on vmtool networks at its host's last report;
            absent when there is none.
          items:
            $ref: "#/components/schemas/VMNetwork"
        origin:
          $ref: "#/components/schemas/VMOrigin"
        comment:
          type: string
          description: From the VM's notes; empty when there is none.
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        gone_since:
          type: string
          format: date-time
          description: Present only on a VM its host no longer has.
        credentials_kept_until:
          type: string
          format: date-time
          description: On a gone VM, when the sweep removes the row and its login.
        has_credentials:
          type: boolean
    Inventory:
      type: object
      required: [hosts, vms, machines]
      properties:
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/InventoryHost"
        vms:
          type: array
          items:
            $ref: "#/components/schemas/InventoryVM"
        machines:
          type: array
          items:
            $ref: "#/components/schemas/MachineSummary"
    Delisted:
      type: object
      required: [uuid, credentials_kept_until, had_credentials]
      properties:
        uuid:
          type: string
        credentials_kept_until:
          type: string
          format: date-time
        had_credentials:
          type: boolean
    NetworkInput:
      type: object
      required: [name, home]
      properties:
        name:
          type: string
          description: The VM name rule, at most 63 characters, never `default`.
        home:
          type: string
          description: The host whose libvirt network is the network's home.
        domain:
          type: string
          description: DNS domain; omitted is `<name>.test`.
        subnet:
          type: string
          description: An IPv4 /24 written as its network address; omitted, the next free /24 of 10.77.0.0/16.
        vni:
          type: integer
          minimum: 1
          maximum: 16777215
          description: A VNI to register as it is (a network a host already made); omitted, the lowest free one from 10000.
    NetworkMemberInput:
      type: object
      required: [lan_ip, lan_dev]
      properties:
        lan_ip:
          type: string
          description: The host's IPv4 address on the LAN, the source of its VXLAN link.
        lan_dev:
          type: string
          description: The interface that address is on (at most 15 characters).
    NetworkMember:
      type: object
      required: [host, lan_ip, lan_dev, joined]
      properties:
        host:
          type: string
        lan_ip:
          type: string
        lan_dev:
          type: string
        joined:
          type: string
          format: date-time
    Network:
      type: object
      required: [name, vni, bridge, subnet, domain, home, created, members]
      properties:
        name:
          type: string
        vni:
          type: integer
        bridge:
          type: string
          description: "`vmt-` plus the VNI as six lowercase hex digits."
        subnet:
          type: string
        domain:
          type: string
        home:
          type: string
        created:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/NetworkMember"
    NetworkList:
      type: object
      required: [networks]
      properties:
        networks:
          type: array
          items:
            $ref: "#/components/schemas/Network"
    NetworkReservationInput:
      type: object
      required: [ip, host, vm]
      properties:
        ip:
          type: string
          description: The reserved IPv4 address.
        host:
          type: string
          description: The host the VM with this card is on.
        vm:
          type: string
          description: The VM's name.
        uuid:
          type: string
          description: >
            The VM's libvirt UUID when the client knows it; empty otherwise. A
            record without one is never orphaned by the inventory sweep. A
            PUT with none keeps the UUID already recorded.
    NetworkReservation:
      type: object
      required: [network, mac, ip, host, vm, created]
      properties:
        network:
          type: string
        mac:
          type: string
          description: Lowercase, colon-separated.
        ip:
          type: string
        host:
          type: string
        vm:
          type: string
        uuid:
          type: string
          description: The VM's UUID, empty when not known.
        orphaned_at:
          type: string
          format: date-time
          description: >
            Set when the reservation is orphaned (see
            `listOrphanedNetworkReservations`); absent otherwise.
        created:
          type: string
          format: date-time
    NetworkReservationList:
      type: object
      required: [reservations]
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/NetworkReservation"
    NetworkPeer:
      type: object
      required: [host, lan_ip]
      properties:
        host:
          type: string
        lan_ip:
          type: string
    HostNetwork:
      type: object
      description: >
        One network of a host. `member` is the host's own membership and is
        absent when the host is only the network's home.
      required: [name, vni, bridge, subnet, domain, home, peers]
      properties:
        name:
          type: string
        vni:
          type: integer
        bridge:
          type: string
        subnet:
          type: string
        domain:
          type: string
        home:
          type: string
        member:
          $ref: "#/components/schemas/HostNetworkSelf"
        peers:
          type: array
          description: The other members, by host name, with their LAN addresses.
          items:
            $ref: "#/components/schemas/NetworkPeer"
    HostNetworkSelf:
      type: object
      required: [lan_ip, lan_dev]
      properties:
        lan_ip:
          type: string
        lan_dev:
          type: string
    HostNetworks:
      type: object
      required: [host, networks]
      properties:
        host:
          type: string
        networks:
          type: array
          items:
            $ref: "#/components/schemas/HostNetwork"
