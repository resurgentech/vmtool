openapi: 3.0.3
info:
  title: vmtool store API
  version: 1.1.0
  description: >
    HTTP surface of `vmtool-store`, the image and credential store that runs as
    a container behind a TLS-terminating proxy. Spec-first: models, stdlib
    ServerInterface, embedded spec and a client are generated from this file.
    Every operation except GET /version requires
    `Authorization: Bearer <token>`; the store checks the token's SHA-256
    against the named hashes in tokens.yaml and answers 401 otherwise. The
    credential routes carry secrets only in the body of a successful GET;
    no other response and no log line does. The one other credential is a
    download ticket, accepted only on the image blob route. A host token
    (one per host, `host_tokens.yaml`) is a limited bearer token: it is
    accepted only on `GET /v1/whoami` and `PUT /v1/hosts/{host}/inventory`;
    on every other route it answers 401, as a ticket does. It reads no
    credential, image or other host.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /version:
    get:
      operationId: getVersion
      summary: Reachability probe; public
      security: []
      responses:
        "200":
          description: The store is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
  /v1/whoami:
    get:
      operationId: whoami
      summary: The name of the calling token
      responses:
        "200":
          description: >
            The caller's name and kind. A user token answers its name from
            tokens.yaml and kind `user`; a host token answers `host/<host>`
            and kind `host`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Whoami"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/images:
    get:
      operationId: listImages
      summary: List images, ordered by name
      responses:
        "200":
          description: Every indexed image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getImage
      summary: One image's metadata
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putImage
      summary: Upload an image, streamed
      description: >
        The body is streamed to object storage and hashed as it is written;
        it is never buffered in memory or on local disk and has no size cap.
        The image is indexed only when the body's SHA-256 equals
        `X-Image-SHA256` and its length equals `Content-Length`; otherwise the
        new object is deleted and the answer is 400. A push of an existing
        name with a new digest replaces it, and until the new object is
        indexed the old image keeps being served. A push of the digest that
        is already indexed answers 200 without rewriting. One push of a name
        runs at a time; a second answers 409 at once. A request without a
        `Content-Length` (chunked) answers 411.
      parameters:
        - name: X-Image-SHA256
          in: header
          required: true
          description: SHA-256 of the body, 64 lowercase hex characters.
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: Content-Length
          in: header
          required: false
          description: Body length in bytes; required (411 when absent).
          schema:
            type: integer
            format: int64
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: The same digest was already indexed; nothing was rewritten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "201":
          description: The image is stored and indexed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Another push of this name is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "411":
          description: The request has no Content-Length.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteImage
      summary: Delete an image
      responses:
        "204":
          description: The image is deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A push of this name is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}/blob:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getImageBlob
      summary: Download an image's bytes, streamed
      description: >
        Accepts `Authorization: Bearer <token>`, or
        `Authorization: Ticket <ticket>` for a ticket minted for this image
        and its current SHA-256. A ticket is good for one download. The
        response carries `Content-Length` and `X-Image-SHA256`.
      security:
        - bearerAuth: []
        - ticketAuth: []
      responses:
        "200":
          description: The image bytes.
          headers:
            X-Image-SHA256:
              description: SHA-256 of the body, 64 lowercase hex characters.
              required: true
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/images/{name}/tickets:
    parameters:
      - $ref: "#/components/parameters/Name"
    post:
      operationId: createImageTicket
      summary: Mint a download ticket for one image
      description: >
        Needs a bearer token (a ticket never works here). The ticket opens
        only `GET /v1/images/{name}/blob` of this image at its current
        SHA-256, once, for 15 minutes. The store keeps only the ticket's
        SHA-256, in memory; a restart forgets every ticket. This response is
        the only place the ticket is ever shown.
      responses:
        "201":
          description: A new ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/vms/{host}/{name}:
    parameters:
      - $ref: "#/components/parameters/Host"
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getVMCredential
      summary: A VM's credentials, if the stored record is for this domain UUID
      description: >
        Answers 404 with `"stale": true` when a record exists for another
        UUID (the VM was recreated); that answer carries no credential field.
        A record whose UUID is not current is never used.
      parameters:
        - name: uuid
          in: query
          required: true
          description: The domain UUID the caller holds now (canonical 8-4-4-4-12 hex).
          schema:
            type: string
      responses:
        "200":
          description: The record. The only response of the store that carries a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No record, or a record for another UUID (`stale`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putVMCredential
      summary: Store a VM's credentials, replacing any record for (host, name)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VMCredentialInput"
      responses:
        "200":
          description: Stored. The body never echoes a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VMCredentialRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteVMCredential
      summary: Delete a VM's credentials (whatever UUID they are for)
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/machines:
    get:
      operationId: listMachineCredentials
      summary: List metal and alien machines (names and kinds only)
      responses:
        "200":
          description: Every machine record, ordered by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/machines/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getMachineCredential
      summary: A machine's manifest and credentials
      responses:
        "200":
          description: The record. Carries secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineCredential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putMachineCredential
      summary: Store a machine's manifest and credentials, replacing any record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineCredentialInput"
      responses:
        "200":
          description: Stored. The body never echoes a secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/TooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMachineCredential
      summary: Delete a machine's record
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    ticketAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        `Authorization: Ticket <ticket>`; accepted only by
        GET /v1/images/{name}/blob.
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema:
        type: string
    Host:
      name: host
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request is malformed. The body names the field only.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such image, VM record or machine.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The store failed; the body is fixed text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The request body is over the size limit; the body is fixed text.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Image:
      type: object
      required: [name, sha256, size, updated]
      properties:
        name:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
        updated:
          type: string
          format: date-time
    ImageList:
      type: object
      required: [images]
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    Ticket:
      type: object
      required: [ticket, expires_at, image, sha256, size]
      properties:
        ticket:
          type: string
        expires_at:
          type: string
          format: date-time
        image:
          type: string
        sha256:
          type: string
        size:
          type: integer
          format: int64
    CredentialNotFound:
      type: object
      required: [error]
      properties:
        error:
          type: string
        stale:
          type: boolean
          description: True only when a record exists for another UUID.
    VMCredentialInput:
      type: object
      required: [uuid, username]
      properties:
        uuid:
          type: string
          description: The libvirt domain UUID these credentials belong to.
        username:
          type: string
          maxLength: 65536
        password:
          type: string
          maxLength: 65536
        private_key:
          type: string
          maxLength: 65536
        public_key:
          type: string
          maxLength: 65536
    VMCredential:
      type: object
      required: [host, name, uuid, username, password, private_key, public_key, updated]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        username:
          type: string
        password:
          type: string
        private_key:
          type: string
        public_key:
          type: string
        updated:
          type: string
          format: date-time
    VMCredentialRef:
      type: object
      required: [host, name, uuid, updated]
      properties:
        host:
          type: string
        name:
          type: string
        uuid:
          type: string
        updated:
          type: string
          format: date-time
    MachineCredentialInput:
      type: object
      required: [kind, address, username]
      properties:
        kind:
          type: string
          enum: [metal, alien]
        address:
          type: string
          maxLength: 1024
        username:
          type: string
          maxLength: 65536
        password:
          type: string
          maxLength: 65536
        private_key:
          type: string
          maxLength: 65536
        public_key:
          type: string
          maxLength: 65536
    MachineCredential:
      type: object
      required: [name, kind, address, username, password, private_key, public_key, updated]
      properties:
        name:
          type: string
        kind:
          type: string
        address:
          type: string
        username:
          type: string
        password:
          type: string
        private_key:
          type: string
        public_key:
          type: string
        updated:
          type: string
          format: date-time
    MachineRef:
      type: object
      required: [name, kind, updated]
      properties:
        name:
          type: string
        kind:
          type: string
        updated:
          type: string
          format: date-time
    MachineSummary:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
    MachineList:
      type: object
      required: [machines]
      properties:
        machines:
          type: array
          items:
            $ref: "#/components/schemas/MachineSummary"
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
    Whoami:
      type: object
      required: [name]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [user, host]
          description: >
            Which kind of token called. Absent from a store older than
            1.1.0, which has only user tokens.
