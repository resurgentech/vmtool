openapi: 3.0.3
info:
  title: vmtool API
  version: 2.6.0
  description: >
    HTTP surface of `vmtool server`. Spec-first: models, stdlib ServerInterface,
    embedded spec, and a test client are generated from this file. Metal and
    alien machines (/metal) are SSH/Ansible targets registered in
    .machines/<name>/machine.yml, not libvirt domains. CLI `vmtool ssh` and
    TUI `t` exec ssh locally. Default bind is 127.0.0.1:9473. The server
    serves HTTPS only, loopback included, and refuses to start without
    token_sha256, tls_cert and tls_key in config.yml. Every operation except
    the docs routes (/, /openapi.yaml, /openapi.json) and GET /version
    requires `Authorization: Bearer <token>`; the server checks the token's
    SHA-256 against token_sha256 in config.yml and answers 401 otherwise.
    Paths are versioned (/v1/...) and VM, network, bridge, image and pool
    routes are scoped to a host (/v1/hosts/{host}/...). GET /version is
    public and unversioned: a reachability probe that clients do not use to
    compare versions.
    A workstation whose config.yml has a `server:` block decides, per request,
    for the operations that use guest credentials, machine records or base
    images, whether its store answers. When it does not, the request still
    runs, in local mode, and the response carries one `X-Vmtool-Warnings`
    header per warning: one line of text, absent when there is none. The
    header is not declared per response; it can appear on any response of
    those operations.
    createVM and runPlaybook are synchronous and may run for many minutes; clients must not
    use a short HTTP timeout.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /:
    get:
      operationId: getDocs
      summary: Swagger UI for this API
      security: []
      description: >
        Interactive OpenAPI reference (Swagger UI) that loads /openapi.yaml.
        The machine-readable contract is GET /openapi.yaml or GET /openapi.json.
      responses:
        '200':
          description: Swagger UI
          content:
            text/html:
              schema: { type: string }
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: OpenAPI document (YAML)
      security: []
      responses:
        '200':
          description: the committed spec
          content:
            application/yaml:
              schema: { type: string }
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      summary: OpenAPI document (JSON)
      security: []
      responses:
        '200':
          description: the committed spec as JSON
          content:
            application/json:
              schema: { type: object }
  /version:
    get:
      operationId: getVersion
      summary: API and build version of this server
      description: >
        Public (no Authorization header needed) and unversioned: a
        reachability probe. api_version is info.version of this document,
        informational only; clients do not compare it.
      security: []
      responses:
        '200':
          description: version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionInfo' }
  /v1/hosts:
    get:
      operationId: listHosts
      summary: List the hosts this server knows, with their status
      description: >
        Probes each configured host (GET /version over TLS, 5 s timeout, no
        Authorization header) concurrently. An unreachable host is a row with
        reachable false and its error, not a failed request.
      responses:
        '200':
          description: hosts, the local one first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HostInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/hosts/{host}/vms:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listVMs
      summary: List all VMs
      responses:
        '200':
          description: VMs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: createVM
      x-vmtool-workstation-only: true
      summary: Create and start a VM
      description: >
        Synchronous. Waits for an address, then for SSH, then runs an optional
        grow and playbook. Clients need a long HTTP timeout. The two waits are
        the workstation's config.yml `ip_wait_seconds` and `ssh_wait_seconds`
        (default 120 each). 201 means the domain is up, an address was seen
        and SSH answered (or `no_wait` was set, which returns right after the
        domain starts), and every requested extra (grow, playbook, reboot)
        succeeded. No address, or no SSH, within its wait is a 500 with the VM
        in the body: the VM is left defined and running, never
        auto-undefined; delete it, or create with `no_wait` for a guest whose
        address or SSH vmtool cannot see. Every failure after the domain
        exists is 500. 400 if `no_wait` is combined with `playbook`. 409 if
        the name is registered as a metal or alien machine.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVMRequest' }
            example:
              name: web
              image: ubuntu2404.qcow2
              vcpus: 2
              memory: 2
              net_type: nat
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    get:
      operationId: getVM
      summary: Show one VM
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteVM
      summary: Stop and undefine a VM
      parameters:
        - name: noclone
          in: query
          required: false
          description: if true, undefine only and keep the disk
          schema: { type: boolean, default: false }
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/start:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: startVM
      summary: Start a stopped VM
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/stop:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: stopVM
      summary: Graceful shutdown
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/resume:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: resumeVM
      summary: Resume a paused VM
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/poweroff:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: poweroffVM
      summary: Force power-off
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/reboot:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: rebootVM
      summary: Reboot a running VM
      description: >
        ACPI reboot via libvirt. The domain stays defined and should come back
        running if the guest handles the request. Distinct from stop (shutdown
        to shutoff) and poweroff (forced destroy).
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/autostart:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    put:
      operationId: setAutostart
      summary: Enable or disable autostart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutostartRequest' }
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/comment:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    put:
      operationId: setVMComment
      summary: Set or clear a VM's comment (API 2.6.0)
      description: >
        The comment is optional free text kept with the VM, in the domain's
        own definition (libvirt domain metadata, in vmtool's namespace). It is
        not a secret: it is stored in plain text. At most 512 bytes of UTF-8,
        on one line, with no control characters; an empty string clears it.
        The daemon writes it to the persistent definition and, when the VM
        runs, to the running domain, without redefining the VM. A comment
        that breaks a rule is 400, and the message names `comment`. Answers
        the VM, whose `comment` is the stored value.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentRequest' }
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/exec:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: execVM
      x-vmtool-workstation-only: true
      summary: Run a program over SSH
      description: >
        `command` is the exact argument list (argv): vmtool single-quotes every
        argument before ssh joins them, so the guest receives exactly those
        arguments and no shell parses them. For shell features run
        `["sh", "-c", "echo hi | wc -c"]`.
        Returns remote stdout, stderr, and exit_code. 200 even when exit_code is non-zero. 502 if SSH transport fails.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecRequest' }
            examples:
              plain:
                summary: No standard input
                value:
                  command: [sh, -c, echo hi | wc -c]
              with_stdin:
                summary: Text on standard input
                value:
                  command: [sh, -c, "umask 077; cat > /p/.env.new && mv /p/.env.new /p/.env"]
                  stdin: "KEY=PLACEHOLDER\n"
      responses:
        '200':
          description: remote result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/tunnel:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    get:
      operationId: openVMTunnel
      summary: Upgrade the connection to a raw byte stream to the guest's SSH port
      description: >
        Plain HTTP/1.1 connection upgrade (RFC 9110 section 7.8), not
        WebSocket. The request must be HTTP/1.1 and carry
        `Connection: Upgrade` and `Upgrade: vmtool-tunnel` (these headers
        are required but not declared as parameters, so a missing one is
        this operation's JSON 400, not a generated one), no request body,
        and the bearer token like every non-docs route. The server resolves
        the VM through libvirt (404 for an unknown host or VM, 409 when it
        has no IP address) and dials TCP port 22 at the IP libvirt reports,
        with a 5 s timeout (502 on failure). It never connects to any other
        address or port; there is no port parameter. Every refusal is an
        ordinary JSON response sent before the upgrade. On success the
        server answers exactly
        `HTTP/1.1 101 Switching Protocols\r\nConnection: Upgrade\r\nUpgrade: vmtool-tunnel\r\n\r\n`
        and from then on the TCP/TLS connection carries the guest's port 22
        bytes verbatim in both directions, with no framing. Bytes the client
        sends right after the request headers are delivered to the guest.
        When either side closes, the server closes both connections.
        HTTP/2 cannot upgrade a connection; an HTTP/2 request gets 426.
      responses:
        '101':
          description: >
            Switching Protocols. No body: after the response headers the
            connection is a raw byte stream to the guest's TCP port 22.
          headers:
            Connection:
              schema: { type: string, enum: [Upgrade] }
            Upgrade:
              schema: { type: string, enum: [vmtool-tunnel] }
        '400':
          description: >
            Missing `Connection: Upgrade` or `Upgrade: vmtool-tunnel`, a
            request body, or an invalid VM name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The VM has no IP address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '426':
          description: >
            Not HTTP/1.1 (for example HTTP/2, which cannot upgrade a
            connection). Retry over HTTP/1.1.
          headers:
            Upgrade:
              schema: { type: string, enum: [vmtool-tunnel] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502':
          description: Connecting to the guest's port 22 failed or timed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/vms/{name}/console:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    get:
      operationId: openVMConsole
      x-vmtool-workstation-only: true
      summary: Open an interactive terminal on a VM (WebSocket)
      description: >
        A WebSocket (RFC 6455) over HTTP/1.1 that runs the target's login
        shell on a terminal: `ssh -tt` with no remote command, on a local pty
        of `cols` x `rows` (default 80x24). There is no command parameter.
        Send the bearer token in the `Authorization` header of the handshake;
        a handshake carrying any `Origin` header is refused (403), so a
        browser cannot open a console. Typed input goes to the server as
        binary messages; terminal output comes back as binary messages (at
        most 32 KiB each); a text message is a JSON control message,
        `{"event":"resize","cols":N,"rows":N}`, and a text message that is
        not valid is ignored. An inbound message over 64 KiB closes the
        socket with 1009. When the shell exits the server sends the
        remaining output, then closes with code 4000 and reason `exit N`
        (N is ssh's exit status). A server shutdown closes with 4503. The
        server pings every 30 s and ends a console that does not answer.
        When the socket closes for any reason the server kills the shell's
        whole process group. At most 16 consoles run at once (429). Every
        refusal is a JSON response sent before the upgrade, checked in this
        order: bearer token (401), workstation role (403), `Origin` (403),
        HTTP/1.1 (426), WebSocket upgrade headers (400), name, `cols` and
        `rows` (400), target (unknown host or VM, 404), address (a VM with no IP,
        409), console limit (429), ssh or the pty failing to start (502). No
        subprotocol is offered or required. Served by the workstation only:
        on a server whose config.yml role is hypervisor this operation
        answers 403 "served by the workstation". The full contract, the
        close-code table and a client example are in spec/README.md,
        "Console (WebSocket)".
      parameters:
        - $ref: '#/components/parameters/ConsoleCols'
        - $ref: '#/components/parameters/ConsoleRows'
      responses:
        '101':
          description: >
            Switching Protocols: the connection is now a WebSocket.
          headers:
            Connection:
              schema: { type: string, enum: [Upgrade] }
            Upgrade:
              schema: { type: string, enum: [websocket] }
        '400':
          description: >
            Not a WebSocket upgrade, a request body, an invalid name, or
            `cols` or `rows` not an integer in 1-65535.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            The server's role is hypervisor (workstation only), or the
            handshake carries an `Origin` header (browser access is not
            allowed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: The VM has no IP address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '426':
          description: Not HTTP/1.1 (for example HTTP/2). Retry over HTTP/1.1.
          headers:
            Upgrade:
              schema: { type: string, enum: [websocket] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: There are already 16 consoles open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502':
          description: ssh or the local pty could not be started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/hosts/{host}/vms/{name}/playbook:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: runPlaybook
      x-vmtool-workstation-only: true
      summary: Run an Ansible playbook against the VM
      description: >
        Synchronous; may run for many minutes. Bare names resolve under ansible/playbooks.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybookRequest' }
            example:
              playbook: setup_bot.yml
      responses:
        '200':
          description: ansible finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500':
          description: ansible or orchestration failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookResult' }
  /v1/hosts/{host}/vms/{name}/migrate-disk:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: migrateDisk
      summary: Move the VM disk to another pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MigrateDiskRequest' }
      responses:
        '200':
          description: VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VMInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/resize-disk:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: resizeDisk
      x-vmtool-workstation-only: true
      summary: Grow the VM disk and filesystem if running
      description: >
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResizeDiskRequest' }
      responses:
        '200':
          description: volume resized; grow_error set if guest grow failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResizeDiskResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/add-disk:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: addDisk
      summary: Create an empty qcow2 volume and attach it to the VM
      description: >
        Creates a new empty qcow2 volume named {vm}-N.qcow2 (N starts at 2,
        then 3 on the next call) and attaches it as the next virtio disk
        (vdb, vdc, …). Live + persistent if the domain is running;
        persistent only if it is shut off. The guest sees a raw block device;
        it is not partitioned or formatted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddDiskRequest' }
            example:
              size: 50
      responses:
        '200':
          description: disk attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddDiskResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/networks:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listNetworks
      summary: List libvirt networks
      responses:
        '200':
          description: network names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/bridges:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listBridges
      summary: List host bridges
      responses:
        '200':
          description: bridge names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listImages
      summary: List disk images grouped by pool
      responses:
        '200':
          description: map of pool name to image names
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images/{name}:
    parameters:
      - $ref: '#/components/parameters/HostName'
    delete:
      operationId: deleteImage
      summary: Delete a disk image
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: pool
          in: query
          required: false
          description: >
            Storage pool holding the image. Omitted or empty is
            the host's default pool (`default` on a workstation, `vmtool` on a hypervisor).
          schema: { type: string }
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    put:
      operationId: uploadImage
      summary: Store a base image in a hypervisor's image cache
      description: >
        Served by hypervisor daemons only (a workstation answers 403: its
        `vmtool create` uploads to a hypervisor's daemon directly). The body
        is the image's bytes, streamed; `Content-Length` is required (411
        without it, 400 when it is 0) and this route alone is exempt from
        the server's 1 MiB request body limit. {name} must be a plain name
        (letters, digits, '.', '_', '-'; not starting with '.'; at most 200
        bytes). A missing X-Image-SHA256 is 400.
        Ownership: the daemon owns a volume only if its `image-manifest.yml`
        lists the name. If any storage pool has a volume called {name}, or a
        file called {name} is in the `vmtool` pool's directory, and the
        manifest does not list it, the answer is 409
        `image "<name>" already exists on <host> at <path>; vmtool did not
        create it and will not replace it`, sent before the body is read;
        nothing is written or deleted. Otherwise the body is written to
        `.<name>.part` in the `vmtool` pool's directory while being hashed.
        A short body or a SHA-256 that differs from X-Image-SHA256 is 400;
        the temporary file is removed and the old volume and the manifest are
        untouched. While an upload of {name} is running in this daemon, a
        second PUT of {name} is 409 before its body is read, and the running
        upload's temporary file is left alone. Otherwise a `.<name>.part`
        left by an interrupted upload is deleted (a symlink as a link, never
        its target) and the upload goes ahead; one another process creates
        meanwhile is 409. At start a hypervisor daemon deletes every
        `.<name>.part` (regular file or symlink, {name} a valid image name)
        in the `vmtool` pool's directory and nothing else. On success the old
        volume is deleted only if the manifest lists {name} (and only from
        the `vmtool` pool); the new file is put in place with a hard link,
        which fails rather than overwrite a file that appeared during the
        upload (409, temporary file removed); the manifest records the new
        SHA-256 and size and the pool is refreshed. The image cache is the
        hypervisor's `vmtool` libvirt pool (made by `just prereqs <host>`);
        without it the answer is 500 `no storage pool "vmtool" on <host>`.
      parameters:
        - $ref: '#/components/parameters/ImageName'
        - name: X-Image-SHA256
          in: header
          required: true
          description: SHA-256 of the body, 64 hex digits.
          schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: stored; the manifest entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageManifestEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '411': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images/{name}/fetch:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/ImageName'
    post:
      operationId: fetchImage
      summary: Have a hypervisor's daemon download a base image from the store (API 2.3.0)
      description: >
        Served by hypervisor daemons (a workstation forwards it to the listed
        {host}; for its own unlisted name it answers 403). The daemon
        downloads `GET /v1/images/{name}/blob` from the `store_url` in its own
        `config.yml` (a hypervisor key, https only; written by `just deploy`
        from the client's `server.url`), sending the request's one-use
        `ticket` as `Authorization: Ticket <ticket>`. No request field changes
        the address: it uses the system trust store, never follows a redirect
        and uses no proxy. The ticket is never logged, never in an error, an
        NDJSON line or a response. Without `store_url` the answer is 409
        `no store configured on <host>; redeploy with a store`. Before the
        download starts the same refusals as `uploadImage` apply: a foreign
        {name} is 409, a second fetch or upload of {name} running in this
        daemon is 409, a bad name, digest, size or ticket shape is 400.
        Otherwise the answer is 200 `application/x-ndjson`, one
        FetchImageEvent per line: `progress` lines, then exactly one `done`
        (with the manifest entry) or one `error`. An image already cached with
        this digest and size is a single `done` line and no download. The
        bytes go through the receive path of `uploadImage` (`.<name>.part`,
        SHA-256 and size checked, hard link, manifest entry only on a match):
        a mismatch leaves no file, no temporary file and no manifest entry,
        and the `error` line has reason `mismatch`. The store's
        `Content-Length` and `X-Image-SHA256` are checked against the
        request's `size` and `sha256` before the body is read; a disagreement
        is a `mismatch` error line. A store that cannot be reached from the
        host (connection, TLS or timeout) is an
        `error` line with reason `store_unreachable` and a message that begins
        `store unreachable from <host>:`; a store that answers another status
        (an expired or spent ticket is 401), including a redirect, is reason
        `store_refused`; any
        other failure is `other`. A daemon that predates this operation
        answers 404 with a plain-text body (no JSON error).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FetchImageRequest' }
      responses:
        '200':
          description: NDJSON progress, ending in one `done` or one `error` line
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/FetchImageEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images/{name}/manifest:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/ImageName'
    get:
      operationId: getImageManifest
      summary: A hypervisor's image-cache entry for one image
      description: >
        Answered by a hypervisor daemon from its `image-manifest.yml`. sha256,
        size and path are present when the manifest lists {name} and that
        file is in the `vmtool` pool's directory with the listed size.
        foreign is true when the manifest does not list {name} and a volume
        of that name exists (any storage pool, or a file in the `vmtool`
        pool's directory); path then names it. A workstation answers for a
        configured remote host by asking that host's daemon, and answers 403
        for itself (it keeps no image cache).
      responses:
        '200':
          description: the entry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageManifestEntry' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images/{name}/blob:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/ImageName'
    get:
      operationId: getImageBlob
      summary: Download a cached image or a template's export volume (API 2.4.0; export volumes 2.5.0)
      description: >
        Streams the bytes of one image of a hypervisor's image cache, for
        `vmtool images pull host/<name>`. A name the daemon's own
        `image-manifest.yml` lists is served as it always was: {name} must be
        a valid image name (400); the file is the manifest entry's file in
        the `vmtool` pool's directory (the validated name joined to that
        directory, nothing else from the request reaches the filesystem),
        opened without following a symlink; anything but a regular file of
        exactly the listed size is 409. The answer carries `Content-Length`
        and `X-Image-SHA256` (the manifest's digest, which the client checks
        the bytes against). A name the manifest does not list but a foreign
        volume has is 409 (the daemon never serves a file it did not
        create). Since 2.5.0 a name the manifest does not list is also looked
        up among the template export volumes (`templates export`; {name} is
        the template's name) and the volume's qcow2 bytes are streamed,
        hashed while they are sent. When the volume's digest is already
        recorded the answer is as for a manifest entry (`Content-Length`,
        `X-Image-SHA256`). Otherwise it carries `X-Image-Size` (the byte
        count, instead of `Content-Length`), declares the trailer
        `X-Image-SHA256`, streams the body chunked, and sends the digest of
        the bytes it sent as that trailer after the last byte; the client
        compares at the end and keeps nothing on a mismatch or a missing
        trailer. The daemon records the digest on the export volume and its
        template only after the whole body was written; a short send records
        nothing. 404 when neither a manifest entry nor an export volume has
        the name (the message names `templates export`). The body is never
        logged. A workstation forwards to the listed {host}'s daemon,
        relaying the header or the trailer unchanged, and answers 403 for
        itself.
      responses:
        '200':
          description: the image bytes
          headers:
            X-Image-SHA256:
              description: >
                SHA-256 of the bytes, 64 lowercase hex digits. A header when
                the digest was known before the send; otherwise an HTTP
                trailer, sent after the last byte (2.5.0).
              schema: { type: string }
            X-Image-Size:
              description: >
                the byte count of the body, sent (2.5.0) when the digest is
                not yet known and the body is chunked, so there is no
                Content-Length
              schema: { type: integer, format: int64 }
            Content-Length:
              description: the image's size in bytes, when the digest is known before the send
              schema: { type: integer, format: int64 }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/pools:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listPools
      summary: List storage pools
      responses:
        '200':
          description: pools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PoolInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPool
      summary: Create a directory storage pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePoolRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePoolResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/templates:
    parameters:
      - $ref: '#/components/parameters/HostName'
    get:
      operationId: listTemplates
      summary: List the thin-pool templates of a host (API 2.4.0)
      description: >
        Every template of every vmtool thin pool the host's daemon keeps
        (`vmtpl-<12hex>` LVs tagged `vmtool_template`), image templates and
        saved ones, in the helper's report order. `stale` is true for an image
        template whose (image name, SHA-256) is not the host's current image
        manifest entry for that name; a saved template is never stale. A host
        with no thin pools (one served by local libvirt) answers an empty
        list.
      responses:
        '200':
          description: templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTemplate
      summary: Build an image template ahead of the first create, or save a VM as a template (API 2.4.0)
      description: >
        With `from_vm` (and `name`), saves a VM as a project template instead;
        see below. Otherwise builds the image template of `image` in the thin pool `pool` (omitted:
        the host's default pool) from the host's cached copy of the image, as
        the first create into that pool would; a template that is already
        built is returned unchanged and nothing is written. When the request
        reaches a workstation for a listed host, the workstation first syncs
        the image to the host as `createVM` does (store fetch, relay or
        upload). The host has no image of that name: 404. `pool` is not a thin
        pool, the image is not in the daemon's manifest, or the request has no
        `image`: 400. The pool has no room: 409. A host with no thin pools: 400.
        Save: `from_vm` names a VM of the host and `name` the template. The VM
        must be shut off, and its boot disk must be a `vmtool_vol` thin LV; the
        template is a `-kn` thin snapshot of that LV, in the same pool, tagged
        `vmtool_template`, `vmtool_origin=saved`, `vmtool_name=<name>`. The VM
        and its disk are untouched, and nothing is booted, mounted or inspected.
        No image is synced. `image` and `from_vm` together, or neither: 400. A
        VM that is not shut off: 409. A disk that is not on a thin pool, or an
        invalid `name`: 400. A `name` already used by a template or a cached
        image on the host: 409, unless `replace` is true and the thing is a
        saved template (an image template or a cached image is never
        replaced); the new template is made before the old one is removed. No
        room in the pool: 409. A VM that is not found: 404. The 201 body's
        `extra_disks` lists the VM's other disks, which are not part of the
        template.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: the template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/templates/{name}:
    parameters:
      - $ref: '#/components/parameters/HostName'
    delete:
      operationId: deleteTemplate
      summary: Remove a template; its clones keep working (API 2.4.0)
      description: >
        Removes one template LV. `{name}` is the template's name (its
        `vmtool_name`) or its LV name (`vmtpl-<12hex>`), and must be a plain
        name. Only a volume the daemon's report lists as a template is ever
        removed: any other name, a VM's volume and a volume still being built
        included, is 404. A name that matches more than one template (the
        current and a stale image template of one image, or two pools) is 409
        listing the LV names and pools; repeat with the LV name and/or `pool`.
        Clones are thin snapshots and are not touched.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: pool
          in: query
          required: false
          description: only the template in this thin pool
          schema: { type: string }
      responses:
        '200':
          description: the template that was removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/templates/{name}/export:
    parameters:
      - $ref: '#/components/parameters/HostName'
    post:
      operationId: exportTemplate
      summary: Export a template as a qcow2 volume on the array (API 2.4.0; export volumes 2.5.0)
      description: >
        Served by hypervisor daemons (a workstation forwards to the listed
        {host}; for its own unlisted name it answers 403). `{name}` is a
        template's name (`vmtool_name`) or LV name, resolved to exactly one
        template as `deleteTemplate` does (404 none, 409 several; `pool`
        limits the match). Since 2.5.0 the template is converted into a
        temporary thick export volume (`vmexp-<12 hex>`) in the array's volume
        group, never into the image cache: no file is written in the image
        directory, no `.part`, no manifest entry, so `images list` does not
        show it. The daemon removes the volume 24 hours after it was made;
        `images pull host/<name>` (getImageBlob) reads it. An export volume
        the template already has is reused. No room on the array (outside the
        thin pool's growth reserve) is 409 before anything is written. The
        same name conflicts as before apply: a foreign volume of that name, or
        a manifest entry that is not this template's, is 409; an image
        template is only ever exported as the cached image it was built from
        (one `done` line, nothing written); a second export of the name
        running in this daemon is 409. Otherwise the answer is 200
        `application/x-ndjson`, one ExportTemplateEvent per line: `progress`
        lines (stage `export` from the converter's percent, stage `hash` while
        the volume is read for its digest), then exactly one `done` (its
        `image` carries the template's name as `name` and the qcow2's byte
        count as `size`; `sha256` only when the digest is known: with
        `hash=true` the daemon reads the volume once, unless the digest is
        already recorded, and records it on the volume and the template) or
        one `error`. Bodies are never logged.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: pool
          in: query
          required: false
          description: only the template in this thin pool
          schema: { type: string }
        - name: hash
          in: query
          required: false
          description: >
            2.5.0: have the daemon read the export volume once (unless its
            digest is already recorded) and put the SHA-256 in the `done`
            line; `templates export --push` asks for it because the store
            wants the digest before the bytes. Default false.
          schema: { type: boolean }
      responses:
        '200':
          description: NDJSON progress, ending in one `done` or one `error` line
          content:
            application/x-ndjson:
              schema: { $ref: '#/components/schemas/ExportTemplateEvent' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/images/{name}/path:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/ImageName'
    get:
      operationId: getImagePath
      summary: Host path of a disk image
      description: >
        Daemon primitive (Manager.ImagePath). Searches every storage pool for a
        volume called {name} and returns its path on the hypervisor. 404 if no
        pool holds it.
      responses:
        '200':
          description: path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/volumes:
    parameters:
      - $ref: '#/components/parameters/HostName'
    post:
      operationId: createVolume
      summary: Create an empty qcow2 volume
      description: >
        Daemon primitive (Manager.CreateVolume). Creates {name}.qcow2 of
        size_gb GB in pool and returns its path; an omitted pool is the
        host's default pool (`default` on a workstation, `vmtool` on a
        hypervisor). `name` must be a plain file name: letters, digits, `.`,
        `_`, `-`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVolumeRequest' }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/volumes/clone:
    parameters:
      - $ref: '#/components/parameters/HostName'
    post:
      operationId: cloneVolume
      summary: Clone a volume into a pool
      description: >
        Daemon primitive (Manager.CloneImage). Clones the volume at base_path
        into target_pool as {new_name}.qcow2 and returns the new path; an
        omitted target_pool is the host's default pool (`default` on a
        workstation, `vmtool` on a hypervisor). base_path must resolve inside a libvirt storage pool
        (symlinks and `..` are resolved first); anything else is 400. When
        target_pool is a thin pool (type `thin`) the clone is a thin snapshot
        of the image's template, built first if missing (found by the cached
        image's file name and manifest SHA-256); base_path may then also be the `/dev/<vg>/<lv>` path of a
        saved template. 409 when a thin pool has no room (the message gives
        the numbers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloneVolumeRequest' }
      responses:
        '201':
          description: cloned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PathResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/volumes/resize:
    parameters:
      - $ref: '#/components/parameters/HostName'
    post:
      operationId: resizeVolume
      summary: Resize a volume by path
      description: >
        Daemon primitive (Manager.ResizeVolume). path must resolve inside a
        libvirt storage pool; anything else is 400. No guest filesystem is
        touched.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResizeVolumeRequest' }
      responses:
        '204': { description: resized }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/definition:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    put:
      operationId: defineVM
      summary: Define a VM from a primitive configuration
      description: >
        Daemon primitive (Manager.Define). Registers the domain without
        starting it. The body carries no ssh_user or ssh_pass: a daemon never
        holds guest secrets. disk_path and every extra_disks[].path must
        resolve inside a libvirt storage pool; anything else is 400. The VM
        name in the path must be a plain name (letters, digits, `.`, `_`, `-`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefineVMRequest' }
      responses:
        '204': { description: defined }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteVMDefinition
      summary: Force off and undefine a VM (raw)
      description: >
        Daemon primitive (Manager.Delete). Unlike deleteVM it never touches
        guest credentials under .machines/: it only stops, undefines and, unless
        noclone, deletes the VM's disk volumes. Remote clients use this form.
      parameters:
        - name: noclone
          in: query
          required: false
          description: if true, undefine only and keep the disk
          schema: { type: boolean, default: false }
      responses:
        '204': { description: deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/wait-ip:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: waitVMIP
      summary: Wait for the VM to get an IP address
      description: >
        Daemon primitive (Manager.WaitForIP). Blocks up to timeout_seconds
        (1 to 3600, default 120; send {} for the default), so clients
        need a long HTTP timeout. A timeout is 500 with the libvirt-side
        message.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WaitIPRequest' }
      responses:
        '200':
          description: the address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitIPResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/hosts/{host}/vms/{name}/resize-volume:
    parameters:
      - $ref: '#/components/parameters/HostName'
      - $ref: '#/components/parameters/VMName'
    post:
      operationId: resizeVMVolume
      summary: Grow the VM disk volume (libvirt only)
      description: >
        Daemon primitive (Manager.ResizeDisk). Grows the volume to size_gb GB
        and nothing else: no guest filesystem grow, no credentials. The
        workstation-only resizeDisk is the workflow that also grows the guest. 409 if the volume is on a thin pool
        without room (the message gives the pool's numbers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResizeVMVolumeRequest' }
      responses:
        '204': { description: resized }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/playbooks:
    get:
      operationId: listPlaybooks
      x-vmtool-workstation-only: true
      summary: List playbooks in ansible/playbooks
      description: >
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      responses:
        '200':
          description: playbook filenames
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/inventory:
    get:
      operationId: getInventory
      x-vmtool-workstation-only: true
      summary: The store's inventory of hosts, VMs and machines
      description: >
        What the store last heard from each host daemon (API 2.6.0), read
        through the workstation's configured store: hosts (last report as a
        time, daemon version, live and gone counts), VMs (one row per host and
        libvirt UUID) and the metal and alien machine names the store keeps.
        It is a record, not a live view: no up/down state and no staleness
        mark; `GET /v1/hosts/{host}/vms` is the live view. VMs their host no
        longer has are listed only with `gone=true`. Machines are not filtered
        by `host`. Decides the store mode once, at the start of the request;
        with no store configured, or one that does not answer, the answer is
        503 with a message naming the cause (the request does not fall back to
        local mode: there is no local inventory).
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      parameters:
        - name: host
          in: query
          required: false
          description: Only this host's row and VMs.
          schema: { type: string }
        - name: gone
          in: query
          required: false
          description: Also list VMs their host no longer has.
          schema: { type: boolean }
      responses:
        '200':
          description: the inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '500': { $ref: '#/components/responses/Error' }
        '503':
          description: No store is configured, or the store did not answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /v1/metal:
    get:
      operationId: listMachines
      x-vmtool-workstation-only: true
      summary: List metal and alien machines
      description: >
        Machines registered under .machines/<name>/machine.yml. Each one is
        probed over SSH concurrently with a short connect timeout, so state is
        live but a dead machine costs at most a few seconds.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      responses:
        '200':
          description: machines
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MachineInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '500': { $ref: '#/components/responses/Error' }
    post:
      operationId: addMachine
      x-vmtool-workstation-only: true
      summary: Onboard a metal or alien machine
      description: >
        Synchronous; runs setup_bot.yml (and commission.yml when requested) so
        clients need a long HTTP timeout. The machine must accept SSH as
        packer/packer with passwordless sudo and run an Ubuntu-compatible OS
        (see ansible/playbooks/prep_machine.yml). Writes
        .machines/<name>/machine.yml, then setup_bot.yml replaces packer with
        bot and key auth. Re-running with the same host and kind is safe and
        resumes a failed onboarding. 409 if the name is a libvirt VM, holds
        VM credentials, or is registered with a different host or kind, and
        if the machine is not Ubuntu-compatible or lacks passwordless sudo.
        502 if SSH to the machine fails.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMachineRequest' }
            example:
              name: nuc1
              host: 10.0.0.42
              kind: metal
      responses:
        '201':
          description: onboarded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineInfo' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/metal/{name}:
    parameters:
      - $ref: '#/components/parameters/MachineName'
    get:
      operationId: getMachine
      x-vmtool-workstation-only: true
      summary: Show one machine (probes SSH)
      description: >
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      responses:
        '200':
          description: machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeMachine
      x-vmtool-workstation-only: true
      summary: Forget a machine
      description: >
        Removes .machines/<name>/ (manifest and credentials). Nothing is
        changed on the machine itself; the bot user and its key stay there.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      responses:
        '204': { description: removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /v1/metal/{name}/reboot:
    parameters:
      - $ref: '#/components/parameters/MachineName'
    post:
      operationId: rebootMachine
      x-vmtool-workstation-only: true
      summary: Reboot a machine over SSH
      description: >
        Schedules `systemctl reboot` one second out via sudo and returns
        immediately with state rebooting. There is no power-off or start for
        machines.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      responses:
        '200':
          description: machine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MachineInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/metal/{name}/exec:
    parameters:
      - $ref: '#/components/parameters/MachineName'
    post:
      operationId: execMachine
      x-vmtool-workstation-only: true
      summary: Run a program over SSH
      description: >
        Same contract as execVM: `command` is the exact argv. 200 even when exit_code is non-zero. 502 if SSH transport fails.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExecRequest' }
            examples:
              plain:
                summary: No standard input
                value:
                  command: [sh, -c, echo hi | wc -c]
              with_stdin:
                summary: Text on standard input
                value:
                  command: [sh, -c, "umask 077; cat > /p/.env.new && mv /p/.env.new /p/.env"]
                  stdin: "KEY=PLACEHOLDER\n"
      responses:
        '200':
          description: remote result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /v1/metal/{name}/console:
    parameters:
      - $ref: '#/components/parameters/MachineName'
    get:
      operationId: openMachineConsole
      x-vmtool-workstation-only: true
      summary: Open an interactive terminal on a machine (WebSocket)
      description: >
        A WebSocket (RFC 6455) over HTTP/1.1 that runs the target's login
        shell on a terminal: `ssh -tt` with no remote command, on a local pty
        of `cols` x `rows` (default 80x24). There is no command parameter.
        Send the bearer token in the `Authorization` header of the handshake;
        a handshake carrying any `Origin` header is refused (403), so a
        browser cannot open a console. Typed input goes to the server as
        binary messages; terminal output comes back as binary messages (at
        most 32 KiB each); a text message is a JSON control message,
        `{"event":"resize","cols":N,"rows":N}`, and a text message that is
        not valid is ignored. An inbound message over 64 KiB closes the
        socket with 1009. When the shell exits the server sends the
        remaining output, then closes with code 4000 and reason `exit N`
        (N is ssh's exit status). A server shutdown closes with 4503. The
        server pings every 30 s and ends a console that does not answer.
        When the socket closes for any reason the server kills the shell's
        whole process group. At most 16 consoles run at once (429). Every
        refusal is a JSON response sent before the upgrade, checked in this
        order: bearer token (401), workstation role (403), `Origin` (403),
        HTTP/1.1 (426), WebSocket upgrade headers (400), name, `cols` and
        `rows` (400), target (unknown machine, 404), console limit
        (429), ssh or the pty failing to start (502). No subprotocol is
        offered or required. Served by the workstation only: on a server
        whose config.yml role is hypervisor this operation answers 403
        "served by the workstation". The full contract, the close-code
        table and a client example are in spec/README.md, "Console
        (WebSocket)".
      parameters:
        - $ref: '#/components/parameters/ConsoleCols'
        - $ref: '#/components/parameters/ConsoleRows'
      responses:
        '101':
          description: >
            Switching Protocols: the connection is now a WebSocket.
          headers:
            Connection:
              schema: { type: string, enum: [Upgrade] }
            Upgrade:
              schema: { type: string, enum: [websocket] }
        '400':
          description: >
            Not a WebSocket upgrade, a request body, an invalid name, or
            `cols` or `rows` not an integer in 1-65535.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >
            The server's role is hypervisor (workstation only), or the
            handshake carries an `Origin` header (browser access is not
            allowed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '426':
          description: Not HTTP/1.1 (for example HTTP/2). Retry over HTTP/1.1.
          headers:
            Upgrade:
              schema: { type: string, enum: [websocket] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: There are already 16 consoles open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/Error' }
        '502':
          description: ssh or the local pty could not be started.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/metal/{name}/playbook:
    parameters:
      - $ref: '#/components/parameters/MachineName'
    post:
      operationId: runMachinePlaybook
      x-vmtool-workstation-only: true
      summary: Run an Ansible playbook against the machine
      description: >
        Synchronous; may run for many minutes. Bare names resolve under
        ansible/playbooks. vmtool sets deviceid to the machine name and
        vmtool_kind to its kind unless extra_vars already contains them.
        commission.yml is refused (400); it rewrites machine identity and is
        only run on aliens via addMachine with commission true.
        Served by the workstation only: on a server whose config.yml role is hypervisor this operation answers 403 "served by the workstation" before reading the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybookRequest' }
            example:
              playbook: vm_upgrade.yml
      responses:
        '200':
          description: ansible finished
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkstationOnly' }
        '404': { $ref: '#/components/responses/Error' }
        '500':
          description: ansible or orchestration failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookResult' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The shared VMTOOL_TOKEN. The server stores only its SHA-256
        (token_sha256 in config.yml) and compares in constant time.
  parameters:
    VMName:
      name: name
      in: path
      required: true
      schema: { type: string }
    HostName:
      name: host
      in: path
      required: true
      description: >
        Host name as listed by GET /v1/hosts. A host this server does not
        serve is 404.
      schema: { type: string }
    MachineName:
      name: name
      in: path
      required: true
      schema: { type: string }
    ImageName:
      name: name
      in: path
      required: true
      schema: { type: string }
    ConsoleCols:
      name: cols
      in: query
      required: false
      description: Terminal width in columns, an integer 1-65535. Default 80.
      schema: { type: string, pattern: '^[0-9]+$' }
    ConsoleRows:
      name: rows
      in: query
      required: false
      description: Terminal height in rows, an integer 1-65535. Default 24.
      schema: { type: string, pattern: '^[0-9]+$' }
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    WorkstationOnly:
      description: >
        The server's role is hypervisor and this operation is served by the
        workstation. Sent before the body is read; no libvirt work is done.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >
        Missing or invalid bearer token. Sent with `WWW-Authenticate: Bearer`.
        The body never echoes the presented token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        vm:
          $ref: '#/components/schemas/VMInfo'
        output:
          type: string
          description: ansible combined output when a playbook step failed
    VMInfo:
      type: object
      required: [name, state, vcpus, memory, ip, autostart]
      properties:
        name: { type: string }
        state:
          type: string
          enum: [running, shutoff, paused, crashed, undefined, unknown]
        vcpus: { type: integer, minimum: 0 }
        memory: { type: integer, minimum: 0, description: GiB }
        ip: { type: string }
        autostart: { type: boolean }
        firmware:
          type: string
          enum: [efi, bios]
          description: Firmware the domain boots with, read from its XML. Omitted by a daemon that predates the field.
        disk_cache:
          type: string
          enum: [none, writeback, writethrough, unsafe]
          description: Cache mode of the boot disk (vda), read from its XML. Omitted when the disk names none (the hypervisor's default) or by a daemon that predates the field.
        disk_backing:
          type: string
          enum: [file, block]
          description: What backs the boot disk (vda), read from its XML. file is an image file, block a block device such as a logical volume. Omitted when unknown or by a daemon that predates the field (API 2.2.0).
        uuid:
          type: string
          description: The libvirt domain UUID. Omitted when unknown or by a daemon that predates the field (API 2.3.0).
        origin:
          $ref: '#/components/schemas/VMOrigin'
        comment:
          type: string
          description: The VM's comment (API 2.6.0), read from the domain's metadata. Omitted when there is none, for a VM vmtool did not give one, or by a daemon that predates the field.
    VMOrigin:
      type: object
      description: >
        What a VM was made from and how (API 2.6.0), recorded by vmtool when it
        creates the VM and kept in the domain's metadata. Omitted for a VM made
        before 2.6.0 or outside vmtool.
      required: [clone_kind]
      properties:
        image: { type: string, description: The image name the create named. }
        image_sha256: { type: string, description: "SHA-256 of the image (64 lowercase hex), when the create knew it." }
        template: { type: string, description: The thin template the disk is a snapshot of (clone_kind thin). }
        template_lv: { type: string, description: The template's logical volume name (clone_kind thin). }
        clone_kind:
          type: string
          enum: [thin, block, file, none]
          description: thin = snapshot of a template in a thin pool; block = copy to a logical volume; file = copy to a qcow2 file; none = booted in place (noclone).
        pool: { type: string, description: The storage pool the disk was made in; empty is the host's default pool. }
        created: { type: string, format: date-time, description: When vmtool created the VM (the workstation's clock). }
    InventoryHost:
      type: object
      required: [name, last_report, daemon_version, live, gone]
      properties:
        name: { type: string }
        last_report: { type: string, format: date-time, description: When the host's daemon last reported. A plain time; the store does not judge whether the host is up. }
        daemon_version: { type: string }
        live: { type: integer }
        gone: { type: integer }
    InventoryDisk:
      type: object
      required: [target, pool, capacity_bytes, kind]
      properties:
        target: { type: string }
        pool: { type: string }
        capacity_bytes: { type: integer, format: int64 }
        kind: { type: string, enum: [file, block, thin] }
    InventoryOrigin:
      type: object
      description: What a VM was made from, as its daemon reported it. Omitted for a VM vmtool did not create.
      properties:
        image: { type: string }
        image_sha256: { type: string }
        template: { type: string }
        clone: { type: string }
        pool: { type: string }
        created: { type: string, description: Creation time as the daemon wrote it. }
    InventoryVM:
      type: object
      required: [host, name, uuid, state, vcpus, memory, ip, autostart, firmware, disks, comment, first_seen, last_seen, has_credentials]
      properties:
        host: { type: string }
        name: { type: string }
        uuid: { type: string }
        state: { type: string }
        vcpus: { type: integer }
        memory: { type: integer, description: GiB }
        ip: { type: string }
        autostart: { type: boolean }
        firmware: { type: string }
        disks: { type: array, items: { $ref: '#/components/schemas/InventoryDisk' } }
        origin: { $ref: '#/components/schemas/InventoryOrigin' }
        comment: { type: string }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        gone_since: { type: string, format: date-time, description: Present only on a VM its host no longer has. }
        credentials_kept_until: { type: string, format: date-time, description: On a gone VM, when the store's sweep removes the row and its login. }
        has_credentials: { type: boolean }
    InventoryMachine:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
    Inventory:
      type: object
      required: [hosts, vms, machines]
      properties:
        hosts: { type: array, items: { $ref: '#/components/schemas/InventoryHost' } }
        vms: { type: array, items: { $ref: '#/components/schemas/InventoryVM' } }
        machines: { type: array, items: { $ref: '#/components/schemas/InventoryMachine' } }
    CommentRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          maxLength: 512
          description: At most 512 bytes of UTF-8, one line, no control characters. Empty clears.
    CreateVMRequest:
      type: object
      required: [name, image]
      properties:
        name: { type: string }
        image: { type: string }
        vcpus: { type: integer, minimum: 1 }
        memory: { type: integer, minimum: 1, description: GiB }
        firmware:
          type: string
          enum: [efi, bios]
          default: efi
          description: >
            Guest firmware. efi = UEFI (OVMF, secure boot off; libvirt makes a
            per-VM NVRAM file, removed with the VM). bios = legacy BIOS, for
            an image installed for BIOS. No detection: name bios for such an
            image.
        disk_cache:
          type: string
          enum: [none, writeback, writethrough, unsafe]
          description: >
            Cache mode of the VM's disks. Omitted: unsafe for a clone, no
            cache attribute (the hypervisor's default) with noclone. unsafe
            keeps guest writes that the guest believes are flushed in host
            memory; a host crash or power loss can corrupt the VM's disk. Pick
            none for a VM whose data matters.
        disk_size: { type: integer, minimum: 0, description: GB }
        pool:
          type: string
          description: >
            Storage pool for the cloned disk (and the extra disk unless it
            names its own). Omitted is the host's default pool (`default` on a workstation, `vmtool` on a hypervisor).
        net_type:
          type: string
          enum: [nat, bridge, direct]
          description: >
            nat = libvirt virtual network (default). bridge = host bridge.
            direct = macvtap on a physical NIC.
        net_source:
          type: string
          description: >
            Network name (nat), bridge name (bridge), or host NIC (direct).
        macvtap_mode:
          type: string
          enum: [bridge, vepa, private, passthrough]
          description: >
            Only used when net_type is direct. Default bridge (VMs on the same
            host NIC can see each other). vepa sends hairpin via an external
            switch. private isolates guests from each other. passthrough gives
            the guest exclusive use of the NIC.
        ssh_user: { type: string }
        ssh_pass: { type: string, description: sensitive; never log }
        playbook:
          type: string
          description: Bare name under ansible/playbooks, or a path. After a successful playbook the guest is rebooted.
        noclone:
          type: boolean
          description: >
            If true, boot the image in place instead of cloning it. Disk writes
            persist to the source image. Pair with DELETE ?noclone=true so the
            source volume is not deleted.
        extra_disk:
          $ref: '#/components/schemas/AddDiskRequest'
          description: >
            Optional second virtio disk (vdb). Creates {name}-2.qcow2 and
            attaches it when the domain is defined.
        extra_vars:
          $ref: '#/components/schemas/ExtraVars'
          description: >
            Ansible extra-vars for the optional create-time playbook. Names and
            values follow the ExtraVars rules; a bad one answers 400 before
            anything is created.
        no_wait:
          type: boolean
          default: false
          description: >
            If true, return right after the domain starts: no wait for an
            address, no wait for SSH, and with disk_size no filesystem grow
            (the volume is still resized before boot). The result is 201 with
            the VM, whose address is usually empty. For a guest whose address
            vmtool cannot see (static address, a DHCP server libvirt does not
            run, no guest agent), or a very slow boot. Refused with 400 when
            combined with playbook.
        comment:
          type: string
          maxLength: 512
          description: >
            Optional comment kept with the VM (API 2.6.0): at most 512 bytes of
            UTF-8, one line, no control characters, stored in plain text. 400
            naming `comment` when it breaks a rule.
    MachineInfo:
      type: object
      required: [name, kind, host, state]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [metal, alien]
          description: >
            metal = physical machine. alien = a VM vmtool's libvirt cannot see
            (another hypervisor, a cloud). Both are SSH/Ansible targets only.
        host: { type: string, description: IP or DNS name vmtool SSHes to }
        state:
          type: string
          enum: [reachable, unreachable, rebooting]
          description: >
            From an SSH probe with the stored credentials. rebooting is only
            returned by rebootMachine.
        os:
          type: string
          description: PRETTY_NAME from /etc/os-release when reachable
        error:
          type: string
          description: probe failure detail when unreachable
    AddMachineRequest:
      type: object
      required: [name, host]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: >
            vmtool name and Ansible inventory hostname. Must not collide with
            a libvirt VM.
        host: { type: string, description: IP or DNS name }
        kind:
          type: string
          enum: [metal, alien]
          default: metal
        commission:
          type: boolean
          default: false
          description: >
            alien only. Run commission.yml before setup_bot.yml: new hostname
            (= name), machine-id, and SSH host keys, then reboot. Use for
            aliens cloned from a vmtool image. 400 for metal.
    AutostartRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          description: >
            The exact arguments, program first. Each is passed to the guest as
            one argument, whatever characters it holds; nothing is parsed by a
            shell unless the program is one (`sh -c`).
          items: { type: string }
          minItems: 1
        stdin:
          type: string
          description: >
            Text written to the command's standard input, which is then
            closed. Absent or empty means an empty standard input (as before).
            vmtool never logs it, never puts it in an error and never puts it
            on a command line. Text only, bounded by the server's 1 MiB
            request limit. The command's own output is returned as is: a
            command that prints its input returns it.
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr]
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
    PlaybookRequest:
      type: object
      required: [playbook]
      properties:
        playbook: { type: string }
        extra_vars:
          $ref: '#/components/schemas/ExtraVars'
    ExtraVars:
      type: object
      additionalProperties: { type: string }
      description: >
        Ansible extra-vars. vmtool always sets deviceid to the VM name unless
        this map already contains deviceid. A name must match
        `^[A-Za-z_][A-Za-z0-9_]*$` (ASCII letters, digits and `_`, not starting
        with a digit; an empty name is refused). A value is any text, except
        that a NUL byte is refused. A bad name or value answers 400, naming the
        variable and never its value. Values reach ansible-playbook through its
        environment (`VMTOOL_VAR_<name>`), not its command line; they keep
        extra-var precedence.
    PlaybookResult:
      type: object
      required: [output]
      properties:
        output: { type: string }
        error: { type: string }
    MigrateDiskRequest:
      type: object
      required: [pool]
      properties:
        pool: { type: string }
    ResizeDiskRequest:
      type: object
      required: [size]
      properties:
        size: { type: integer, minimum: 1, description: GB }
    ResizeDiskResult:
      type: object
      required: [vm, filesystem_grown]
      properties:
        vm: { $ref: '#/components/schemas/VMInfo' }
        filesystem_grown: { type: boolean }
        grow_error: { type: string }
    AddDiskRequest:
      type: object
      required: [size]
      properties:
        size: { type: integer, minimum: 1, description: capacity in GB }
        pool:
          type: string
          description: >
            Storage pool for the new volume; omitted is
            the host's default pool (`default` on a workstation, `vmtool` on a hypervisor). Volume name is
            always {vm}-N.qcow2 (N is 2 for the first extra disk, then 3, …).
    AddDiskResult:
      type: object
      required: [vm, path, target]
      properties:
        vm: { $ref: '#/components/schemas/VMInfo' }
        path: { type: string, description: host path of the new volume }
        target:
          type: string
          description: guest virtio device name (vdb, vdc, …)
    CreatePoolRequest:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
    CreatePoolResult:
      type: object
      required: [name, path]
      properties:
        name: { type: string }
        path: { type: string }
    VersionInfo:
      type: object
      required: [api_version, build_version, host]
      properties:
        api_version: { type: string, description: "info.version of this spec" }
        build_version: { type: string, description: "module version or VCS revision of the binary, or unknown" }
        host: { type: string, description: "name this server calls itself" }
    HostInfo:
      type: object
      required: [name, role, local]
      properties:
        name: { type: string }
        role: { type: string, enum: [workstation, hypervisor] }
        local: { type: boolean, description: "true for the host this server runs on" }
        address:
          type: string
          description: "host:port of the daemon this server probed; \"local\" for the host this server runs on"
        reachable:
          type: boolean
          description: "true when the host answered GET /version (the local host always does)"
        api_version: { type: string, description: "the API version the host reported" }
        cert_not_after:
          type: string
          format: date-time
          description: "NotAfter of the leaf certificate the host presented (the local host: its tls_cert file)"
        cert_days_left:
          type: integer
          description: "whole days until cert_not_after, rounded down; negative once expired"
        error:
          type: string
          description: "why the host is unreachable"
    PoolInfo:
      type: object
      required: [name, path, active]
      properties:
        name: { type: string }
        path: { type: string }
        active: { type: boolean }
        type:
          type: string
          description: >
            libvirt's pool type, such as dir or logical, or thin for an LVM
            thin pool the daemon manages itself (API 2.4.0). Omitted when
            unknown or by a daemon that predates the field (API 2.2.0).
        size_bytes:
          type: integer
          format: int64
          description: capacity in bytes (API 2.4.0). Omitted when unknown.
        used_bytes:
          type: integer
          format: int64
          description: bytes in use (API 2.4.0). Omitted when unknown.
        virtual_bytes:
          type: integer
          format: int64
          description: thin pools only (API 2.4.0). The sum of the sizes of every thin volume in the pool, the space it has promised.
        data_percent:
          type: number
          format: double
          description: thin pools only (API 2.4.0). Percent of the data area in use.
        metadata_percent:
          type: number
          format: double
          description: thin pools only (API 2.4.0). Percent of the metadata area in use.
    TemplateInfo:
      type: object
      required: [name, origin, pool, lv, size_bytes, used_bytes, clones, stale]
      description: A thin-pool template (API 2.4.0).
      properties:
        name: { type: string, description: "the template's name: the image's name for an image template, the user's for a saved one" }
        origin: { type: string, enum: [image, saved] }
        image: { type: string, description: "image templates only: the image name" }
        sha256: { type: string, description: "image templates only: the image's SHA-256, lowercase hex" }
        pool: { type: string, description: "the thin pool it is in" }
        lv: { type: string, description: "the LV name, vmtpl-<12hex>" }
        size_bytes: { type: integer, format: int64 }
        used_bytes: { type: integer, format: int64 }
        clones: { type: integer, minimum: 0, description: "volumes in the same VG that are snapshots of this template" }
        stale: { type: boolean, description: "an image template whose image is not the host's current manifest entry for that name" }
        created: { type: string, format: date-time, description: "omitted when the host does not know" }
        extra_disks:
          type: array
          items: { type: string }
          description: "set only by a save (createTemplate with from_vm): the VM's disk targets other than vda, which are not part of the template"
        export: { $ref: '#/components/schemas/TemplateExport' }
    TemplateExport:
      type: object
      required: [bytes]
      description: A finished export volume of a template (API 2.5.0); omitted from TemplateInfo when the template has none.
      properties:
        bytes: { type: integer, format: int64, description: "the qcow2 file's length in bytes" }
        sha256: { type: string, description: "lowercase hex digest; omitted until it is known (after a send or `hash=true`)" }
        expires: { type: string, format: date-time, description: "when the daemon removes the volume (24 hours after it was made); omitted when the host does not know" }
    CreateTemplateRequest:
      type: object
      description: >
        What to make a template from: exactly one of `image` (with an optional
        `pool`) or `from_vm` (with `name`, and optionally `replace`).
      properties:
        image: { type: string, description: "build the image template of this image" }
        pool: { type: string, description: "with image: the thin pool; omitted is the host's default pool" }
        from_vm: { type: string, description: "save this VM (shut off, boot disk on a thin pool) as a project template" }
        name: { type: string, description: "with from_vm: the template's name, a plain image name" }
        replace: { type: boolean, description: "with from_vm: replace the saved template of that name; never an image template or a cached image" }
    ImageManifestEntry:
      type: object
      required: [name, foreign]
      properties:
        name: { type: string }
        sha256: { type: string, description: "lowercase hex SHA-256 the manifest records" }
        size: { type: integer, format: int64, description: "bytes the manifest records" }
        foreign:
          type: boolean
          description: >
            true when a volume of this name exists that the daemon's manifest
            does not list: the daemon will not replace it.
        path: { type: string, description: "the cached file, or the foreign volume's path" }
    FetchImageRequest:
      type: object
      required: [sha256, size, ticket]
      properties:
        sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$', description: "SHA-256 the image must have, 64 hex digits" }
        size: { type: integer, format: int64, minimum: 1, description: "bytes the image must have" }
        ticket:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: "the store's one-use download ticket for this image and digest; sent only to the daemon's store_url as `Authorization: Ticket`, never logged or echoed"
    ProgressEvent:
      type: object
      description: >
        One progress event of a workstation workflow (create today), as the CLI
        and TUI receive it. createVM itself stays a synchronous JSON call and
        streams none; this is the documented shape of the event so a client
        that relays or records them keeps the names.
      required: [stage, status]
      properties:
        stage: { type: string, description: "clone, resize, extra_disk, start, write_inventory, wait_ip, wait_ssh, grow_disk, playbook, reboot, upload, credentials" }
        status: { type: string, description: "start, done, error, progress, hash or notice" }
        detail: { type: string }
        output: { type: string, description: "captured tool output, for a failed or finished step" }
        sent: { type: integer, format: int64, description: "upload: bytes sent so far" }
        total: { type: integer, format: int64, description: "upload: bytes expected" }
        elapsed_ms:
          type: integer
          format: int64
          description: >
            Milliseconds since the operation started, read from the clock of the
            process running the workflow, so a stage's time is the difference of
            two stamps (API 2.4.0). Omitted by a producer that predates the field.
    FetchImageEvent:
      type: object
      description: One line of fetchImage's NDJSON stream.
      required: [event]
      properties:
        event: { type: string, enum: [progress, done, error] }
        received: { type: integer, format: int64, description: "progress: bytes received so far" }
        total: { type: integer, format: int64, description: "progress: bytes expected" }
        image: { $ref: '#/components/schemas/ImageManifestEntry' }
        error: { type: string, description: "error: what failed; never contains the ticket" }
        reason:
          type: string
          enum: [store_unreachable, store_refused, mismatch, other]
          description: "error: why. store_unreachable is the case a client may answer by relaying the image itself."
    ExportTemplateEvent:
      type: object
      description: One line of exportTemplate's NDJSON stream.
      required: [event]
      properties:
        event: { type: string, enum: [progress, done, error] }
        stage: { type: string, enum: [export, hash], description: "progress: what is running" }
        received: { type: integer, format: int64, description: "progress: bytes of the qcow2 file written (export) or hashed (hash) so far" }
        total: { type: integer, format: int64, description: "progress: bytes expected; for stage export the volume's size, an upper bound of the qcow2 file" }
        image: { $ref: '#/components/schemas/ImageManifestEntry' }
        error: { type: string, description: "error: what failed" }
    PathResult:
      type: object
      required: [path]
      properties:
        path: { type: string, description: "absolute path on the hypervisor" }
    CreateVolumeRequest:
      type: object
      required: [name, size_gb]
      properties:
        pool: { type: string, description: "storage pool; omitted is the host's default pool (`default` on a workstation, `vmtool` on a hypervisor)" }
        name: { type: string, description: "plain file name; in a dir pool .qcow2 is appended if missing, in a logical pool the volume has no suffix (a given .qcow2 is dropped)" }
        size_gb: { type: integer, minimum: 1 }
    CloneVolumeRequest:
      type: object
      required: [base_path, new_name]
      properties:
        base_path: { type: string, description: "volume to clone; must resolve inside a storage pool" }
        new_name: { type: string, description: "plain name; in a dir pool the clone is {new_name}.qcow2, in a logical pool it is a volume named {new_name}" }
        target_pool: { type: string, description: "omitted is the host's default pool (`default` on a workstation, `vmtool` on a hypervisor)" }
        size_bytes: { type: integer, format: int64, minimum: 1, description: "the new volume's size when larger than the image's; used by logical and thin pools, ignored by dir pools" }
        template: { type: string, description: "the image name (or saved template name) the clone comes from, as the client asked for it; informational. A thin pool finds the template from base_path: a cached image's file name and manifest SHA-256, or a saved template's /dev/<vg>/<lv>" }
    ResizeVolumeRequest:
      type: object
      required: [path, size_bytes]
      properties:
        path: { type: string, description: "volume path; must resolve inside a storage pool" }
        size_bytes: { type: integer, format: int64, minimum: 1 }
    ResizeVMVolumeRequest:
      type: object
      required: [size_gb]
      properties:
        size_gb: { type: integer, minimum: 1 }
    NetworkConfig:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [nat, bridge, direct] }
        source: { type: string, description: "network name (nat), bridge name (bridge) or host NIC (direct)" }
        macvtap_mode:
          type: string
          enum: [bridge, vepa, private, passthrough]
          description: only used when type is direct
    DiskDevice:
      type: object
      required: [path, target]
      properties:
        path: { type: string, description: "volume path; must resolve inside a storage pool" }
        target: { type: string, description: "guest virtio device name (vdb, vdc, …)" }
    DefineVMRequest:
      type: object
      description: >
        Mirrors the Go VMConfig minus the VM name (it is in the path) and
        minus ssh_user and ssh_pass, which never reach a daemon.
      required: [vcpus, memory_gib, disk_path, network]
      properties:
        vcpus: { type: integer, minimum: 1 }
        memory_gib: { type: integer, minimum: 1 }
        disk_path: { type: string, description: "boot volume; must resolve inside a storage pool" }
        disk_size_gb: { type: integer, minimum: 0, description: "0 keeps the volume size" }
        pool: { type: string, description: "omitted is the host's default pool (`default` on a workstation, `vmtool` on a hypervisor)" }
        network: { $ref: '#/components/schemas/NetworkConfig' }
        noclone: { type: boolean }
        extra_disk_size_gb: { type: integer, minimum: 0 }
        extra_disk_pool: { type: string }
        extra_disks:
          type: array
          items: { $ref: '#/components/schemas/DiskDevice' }
        firmware:
          type: string
          enum: [efi, bios]
          default: efi
          description: >
            Guest firmware. efi = UEFI (OVMF, secure boot off; libvirt makes a
            per-VM NVRAM file, removed with the VM). bios = legacy BIOS, for
            an image installed for BIOS. No detection: name bios for such an
            image.
            Travels explicitly from the workstation; a client that omits it
            gets efi.
        disk_cache:
          type: string
          enum: [none, writeback, writethrough, unsafe]
          description: >
            Cache mode written on every disk driver of the domain. Travels
            explicitly from the workstation, which resolved the default;
            omitted means no cache attribute (the daemon does not guess).
        origin:
          $ref: '#/components/schemas/VMOrigin'
          description: >
            What the VM was made from (API 2.6.0), written into the domain's
            metadata. Optional: a client that omits it (older than 2.6.0)
            makes a VM with no origin, and a daemon older than 2.6.0 ignores it.
        comment:
          type: string
          maxLength: 512
          description: >
            The VM's comment (API 2.6.0), written into the domain's metadata
            with the origin. At most 512 bytes of UTF-8, one line, no control
            characters. 400 naming `comment` when it breaks a rule.
    WaitIPRequest:
      type: object
      properties:
        timeout_seconds: { type: integer, minimum: 1, maximum: 3600, default: 120 }
    WaitIPResult:
      type: object
      required: [ip]
      properties:
        ip: { type: string }
