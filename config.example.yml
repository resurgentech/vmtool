# Copy to config.yml (gitignored). `vmtool config write` creates/updates it and
# sets token_sha256 from VMTOOL_TOKEN (env or .env). The token itself is never
# stored here.
name: ws1                      # optional; default: short hostname
role: workstation             # workstation | hypervisor
listen: 127.0.0.1:9473        # default
token_sha256: ""              # 64 lowercase hex; set by `vmtool config write`
tls_cert: tls/ws1.example.lab.crt
tls_key: tls/ws1.example.lab.key
ip_wait_seconds: 120          # create's wait for a VM's address; 0 or absent = 120, else 1..3600
ssh_wait_seconds: 120         # create's wait for SSH, after the address; same bounds
# Both apply on the workstation only: create runs there (CLI, TUI or its own
# `vmtool server`), and for a VM on a remote host the workstation sends its
# ip_wait_seconds to that host's daemon. A hypervisor accepts and ignores them.
hosts:                        # workstation only
  hv1: { address: hv1.example.lab, ssh_user: ubuntu }   # port defaults to 9473
